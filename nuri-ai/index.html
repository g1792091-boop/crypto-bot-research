<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>누리 AI</title>
<meta name="description" content="내 기기에서 돌아가는 나만의 AI 챗봇. 외부 AI 서비스 없이 동작합니다.">
<meta name="theme-color" content="#0E7A63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Layout: conversation rail left, single reading column center (max 780px), composer docked at bottom; drawer rail on phones */
:root{
  --bg:#F4F5F3; --panel:#FFFFFF; --panel-2:#ECEEEB; --line:#D9DDD8; --ink:#171A1C; --muted:#606A66;
  --accent:#0E7A63; --accent-soft:#DCEFE9; --accent-ink:#FFFFFF; --user:#1E2427; --user-ink:#F3F5F4;
  --ok:#2F7D4B; --warn:#A8691A; --bad:#B53A2F; --code-bg:#1B1F22; --code-ink:#E3E7E5;
  --up:#D23B35; --down:#2563D9; --ma1:#D99414; --ma2:#8B55D6; --ma3:#1F9E8F;
  --f-body:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"D2Coding",monospace;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101315; --panel:#171B1D; --panel-2:#1F2427; --line:#2E3538; --ink:#E6EAE8; --muted:#97A29D;
  --accent:#3FC4A2; --accent-soft:#16332C; --accent-ink:#0B1412; --user:#2A3236; --user-ink:#EEF2F0;
  --ok:#5DBE80; --warn:#E0A64E; --bad:#E57B6E; --code-bg:#0B0D0F; --code-ink:#DCE2DF;
  --up:#F0605A; --down:#5B8DEF; --ma1:#F2B84B; --ma2:#B08CF0; --ma3:#4CC7B6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101315; --panel:#171B1D; --panel-2:#1F2427; --line:#2E3538; --ink:#E6EAE8; --muted:#97A29D;
  --accent:#3FC4A2; --accent-soft:#16332C; --accent-ink:#0B1412; --user:#2A3236; --user-ink:#EEF2F0;
  --ok:#5DBE80; --warn:#E0A64E; --bad:#E57B6E; --code-bg:#0B0D0F; --code-ink:#DCE2DF;
  --up:#F0605A; --down:#5B8DEF; --ma1:#F2B84B; --ma2:#B08CF0; --ma3:#4CC7B6; color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail-top{padding:16px 14px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em}
.newchat{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:9px;font-weight:600}
.newchat:hover{border-color:var(--accent)}
.search{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:7px 10px;font-size:13px}
.chatlist{flex:1;overflow:auto;padding:4px 8px 8px;display:flex;flex-direction:column;gap:2px;min-height:0}
.grp{font-size:11px;color:var(--muted);letter-spacing:.06em;padding:10px 8px 4px}
.ci{display:flex;align-items:center;gap:6px;border-radius:6px;padding:7px 8px;cursor:pointer}
.ci:hover{background:var(--panel-2)}
.ci[aria-current="true"]{background:var(--accent-soft)}
.ci span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.ci .del{opacity:0;border:0;background:transparent;color:var(--muted);padding:0 4px;font-size:12px}
.ci:hover .del,.ci:focus-within .del{opacity:1}
.rail-nav{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px}
.rail-nav button{display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;border-radius:6px;padding:8px 10px;color:var(--muted);font-weight:500;text-align:left}
.rail-nav button:hover{background:var(--panel-2);color:var(--ink)}
.rail-nav button[aria-current="page"]{color:var(--ink);background:var(--panel-2)}
.rail-foot{font-size:11px;color:var(--muted);padding:6px 10px}

main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 9px}
.topbar h1{font-size:15px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px;font-size:13px;max-width:220px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--panel)}
button.pill:hover{border-color:var(--accent);color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

.view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;min-height:0}
.col{max-width:780px;margin:0 auto;padding-block:20px 28px;padding-inline:20px;display:flex;flex-direction:column;gap:22px}

.m{display:flex;flex-direction:column;gap:6px;min-width:0}
.m.user{align-items:flex-end}
.m.user .bubble{background:var(--user);color:var(--user-ink);border-radius:14px 14px 4px 14px;padding:9px 14px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.m.ai .who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.avatar{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px;font-weight:800}
.md{min-width:0;word-break:break-word}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:.55em 0}
.md h1,.md h2,.md h3,.md h4{margin:1em 0 .4em;line-height:1.35;text-wrap:balance}
.md h1{font-size:1.3em}.md h2{font-size:1.18em}.md h3{font-size:1.06em}
.md ul,.md ol{padding-left:1.4em;margin:.5em 0}
.md li{margin:.2em 0}
.md blockquote{margin:.6em 0;padding:.2em .9em;border-left:3px solid var(--line);color:var(--muted)}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--panel-2);padding:.1em .35em;border-radius:4px}
.md a{color:var(--accent)}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.md .tbl{overflow-x:auto;margin:.6em 0}
.md table{border-collapse:collapse;font-size:.93em;min-width:60%}
.md th,.md td{border:1px solid var(--line);padding:5px 10px;text-align:left}
.md th{background:var(--panel-2)}
.codebox{margin:.7em 0;border-radius:8px;overflow:hidden;background:var(--code-bg)}
.codebox .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:11.5px;color:#9AA6A1;font-family:var(--f-mono);border-bottom:1px solid #2A3033}
.codebox .bar button{border:0;background:transparent;color:#C6D0CC;font-size:11.5px}
.codebox pre{margin:0;padding:12px;overflow:auto;color:var(--code-ink);font-family:var(--f-mono);font-size:13px;line-height:1.55}
.codebox pre code{background:transparent;padding:0;color:inherit;font-size:inherit}
details.think{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted);background:var(--panel)}
details.think summary{cursor:pointer}
details.think div{white-space:pre-wrap;margin-top:6px;max-height:260px;overflow:auto}
.tools{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tools button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:4px}
.tools button:hover{background:var(--panel-2);color:var(--ink)}
.tools .meta{font-size:11.5px;color:var(--muted);margin-left:4px}
.srcs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.err{border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent);border-radius:8px;padding:8px 12px;font-size:13.5px}
.files{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fchip{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted);background:var(--panel);display:inline-flex;gap:6px;align-items:center}
.fchip button{border:0;background:transparent;color:var(--muted);padding:0}
.cursor::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.hello{display:flex;flex-direction:column;gap:18px;padding-top:5vh}
.hello h2{font-size:26px;margin:0;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.hello p{margin:0;color:var(--muted)}
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.starter{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 14px;text-align:left;font-size:14px}
.starter:hover{border-color:var(--accent)}
.jump{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
.jump-card{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--panel-2)}
.jump-card:hover{border-color:var(--accent)}
.jump-card b{font-size:15px;color:var(--accent)}
.jump-card span{font-size:12.5px;color:var(--muted)}
.notice{border:1px dashed var(--line);border-radius:var(--r);padding:14px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.notice b{color:var(--ink)}
.notice .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.composer{border-top:1px solid var(--line);background:var(--bg);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.cbox{max-width:780px;margin:0 auto;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.cbox:focus-within{border-color:var(--accent)}
.cbox textarea{border:0;background:transparent;resize:none;outline:none;min-height:44px;max-height:220px;padding:4px 6px;width:100%}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crow .sp{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted);cursor:pointer}
.icon-btn:hover{color:var(--ink);border-color:var(--ink)}
.icon-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.send{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px 16px;font-weight:700}
.send:disabled{opacity:.45;cursor:default}
.send.stop{background:var(--ink);color:var(--bg)}
.hint{max-width:780px;margin:6px auto 0;font-size:11.5px;color:var(--muted);text-align:center}

.page{max-width:1080px;margin:0 auto;padding-block:22px 40px;padding-inline:20px;display:flex;flex-direction:column;gap:18px}
.page h2{font-size:20px;margin:0;letter-spacing:-.01em}
.page .sub{color:var(--muted);margin:2px 0 0;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi label{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:500}
.kpi .s{font-size:11.5px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.card h3{font-size:14px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.card .body{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-115%)}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:13px}
.hbar .track{height:10px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:0 3px 3px 0}
.hbar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .num{text-align:right;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list>div,.list>button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 2px;text-align:left;min-width:0}
.list>:last-child{border-bottom:0}
.list .t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;flex:1}
.list .num{color:var(--muted);font-size:12px;white-space:nowrap}
.empty{color:var(--muted);font-size:13.5px;margin:0}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.tile.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile .hd{display:flex;align-items:center;gap:10px;justify-content:space-between}
.tile .ini{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.tile b{font-size:15px}
.tile p{margin:0;font-size:13px;color:var(--muted);flex:1}
.tile .meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 8px;border-radius:9px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;display:inline-block}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.form .wide{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;color:var(--ink);font-size:14px;width:100%}
.form textarea{resize:vertical;min-height:90px}
.progress{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.small{font-size:12px;color:var(--muted)}
.status{display:flex;flex-direction:column;gap:8px}
.status .line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.status b{font-size:16px}
.hit{border-left:3px solid var(--accent);padding:6px 10px;background:var(--bg);border-radius:0 6px 6px 0;font-size:13px}
.hit .small{display:block;margin-bottom:2px}


/* ---------- 코인 트레이딩 ---------- */
.page.wide{max-width:1560px}
.up{color:var(--up)!important} .down{color:var(--down)!important}
.pill.up{border-color:color-mix(in srgb,var(--up) 45%,transparent);background:color-mix(in srgb,var(--up) 10%,transparent)}
.pill.down{border-color:color-mix(in srgb,var(--down) 45%,transparent);background:color-mix(in srgb,var(--down) 10%,transparent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tr{display:flex;flex-direction:column;gap:14px}
.tr-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tr-title{display:flex;align-items:center;gap:12px}
.tr-title b{font-size:19px;letter-spacing:-.01em}
.tr-price{display:flex;align-items:baseline;gap:10px}
#tr-px{font-size:28px;font-weight:600;letter-spacing:-.02em}
.chg{font-size:14px;font-weight:600}
.tr-stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-left:auto}
.tr-stats div{display:flex;flex-direction:column}
.tr-stats label{font-size:11px;color:var(--muted)}
.tr-stats span{font-size:14px}
.tr-grid{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;gap:14px;align-items:start}
.tr-list .body{max-height:640px}
.tr-rows{display:flex;flex-direction:column;overflow:auto;max-height:580px;margin:0 -4px}
.tr-row{display:grid;grid-template-columns:minmax(0,1fr) auto 58px;gap:8px;align-items:center;border:0;background:transparent;padding:7px 6px;border-radius:6px;text-align:left;font-size:12.5px}
.tr-row:hover{background:var(--panel-2)}
.tr-row.on{background:var(--accent-soft)}
.tr-row .nm{display:flex;flex-direction:column;min-width:0}
.tr-row .nm b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-row .chg{font-size:12px;text-align:right;font-weight:500}
.tr-chart{overflow:hidden}
.tr-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.tr-tools .small{margin-left:auto}
.tr-canvas{position:relative;height:clamp(420px,62vh,640px)}
.tr-canvas canvas{display:block;touch-action:none;cursor:crosshair}
.tr-tip{position:absolute;top:10px;pointer-events:none;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:1px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.tr-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:20px;text-align:center}
.tr-msg-box{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;color:var(--ink)}
.tr-legend{display:flex;flex-wrap:wrap;gap:14px;padding:8px 12px;border-top:1px solid var(--line)}
.tr-legend i,.legend-row i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend-row{display:flex;flex-wrap:wrap;gap:14px}
.tr-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.gauge-top{display:flex;align-items:center;justify-content:space-between}
.gauge-v{font-size:34px;font-weight:600;letter-spacing:-.03em}
.gauge-bar{position:relative;height:10px;border-radius:5px;margin:8px 0 4px;background:linear-gradient(90deg,var(--down),var(--panel-2) 50%,var(--up))}

.bt-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px}

.tbl tr:last-child td{border-bottom:0}

.order{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:8px;padding:12px}
.order .line{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pct-row .btn{flex:1;padding:5px 0}

.side-seg{width:100%}.side-seg button{flex:1;padding:8px}
.side-seg button[data-side="buy"][aria-pressed="true"]{background:var(--up);color:#fff}
.side-seg button[data-side="sell"][aria-pressed="true"]{background:var(--down);color:#fff}

<body>

<script type="module">
import { Wllama } from "./vendor/wllama/index.js";
import { initTrade } from "./trade.js";

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtN = n => Number(n).toLocaleString("ko-KR");
const fmtGB = b => b >= 1e9 ? (b/1e9).toFixed(2) + "GB" : Math.max(1, Math.round(b/1e6)) + "MB";
const ls = {
  get(k, d){ try { const v = localStorage.getItem("nuri:"+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("nuri:"+k, JSON.stringify(v)); } catch(e){} }
};
const toast = m => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2800); };

/* ============ 저장소 (IndexedDB, 실패 시 메모리) ============ */
const idb = (() => {
  let dbp = null; const mem = new Map();
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const r = indexedDB.open("nuri-ai", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch(e){ rej(e); }
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("kv", mode); const st = t.objectStore("kv"); const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); };
  return {
    async put(k, v){ try { await tx("readwrite", s => s.put(v, k)); } catch(e){ mem.set(k, v); } },
    async del(k){ try { await tx("readwrite", s => s.delete(k)); } catch(e){ mem.delete(k); } },
    async all(prefix){
      try {
        const db = await open();
        return await new Promise((res, rej) => { const out = []; const t = db.transaction("kv"); const c = t.objectStore("kv").openCursor(IDBKeyRange.bound(prefix, prefix + "￿")); c.onsuccess = () => { const cur = c.result; if (cur){ out.push(cur.value); cur.continue(); } else res(out); }; c.onerror = () => rej(c.error); });
      } catch(e){ return [...mem].filter(([k]) => k.startsWith(prefix)).map(([,v]) => v); }
    }
  };
})();

/* ============ 봇 ============ */
const BASE_RULES = "답변은 한국어로 한다(사용자가 다른 언어를 쓰면 그 언어로). 핵심부터 간결하게 말하고, 필요하면 목록·표·코드블록(마크다운)을 쓴다. 모르는 것은 모른다고 말하고 지어내지 않는다. 너는 인터넷에 연결되어 있지 않으므로 최신 정보는 확인할 수 없다고 알린다.";
const PRESET_BOTS = [
  {id:"general", name:"만능 비서", desc:"일상 질문, 설명, 아이디어, 계획을 돕습니다.", system:"너는 '누리'라는 이름의 친절하고 정확한 AI 비서다.", starters:["주말 1박 2일 여행 준비물 목록 만들어줘","전세와 월세를 비교하는 기준을 알려줘","블랙홀을 중학생 눈높이로 설명해줘","하루 30분 운동 루틴 짜줘"], preset:true},
  {id:"coder", name:"코딩 도우미", desc:"코드 작성, 디버깅, 설명.", system:"너는 숙련된 소프트웨어 엔지니어다. 동작하는 코드를 코드블록으로 주고 핵심 이유를 짧게 설명한다.", starters:["파이썬으로 CSV 파일 합치는 코드","자바스크립트 배열에서 중복 제거하는 법","SQL로 월별 합계 구하기","이 에러 원인 알려줘: IndexError: list index out of range"], preset:true},
  {id:"translator", name:"번역가", desc:"한국어·영어·일본어·중국어 번역.", system:"너는 전문 번역가다. 입력이 한국어면 영어로, 다른 언어면 한국어로 자연스럽게 번역한다(사용자가 지정하면 그 언어로). 번역문을 먼저 준다.", starters:["회의를 다음 주로 미룰 수 있을까요? 를 정중한 영어로","Thank you for your patience 를 자연스럽게","'수고하셨습니다'를 영어로 상황별로","이 문장을 매끄럽게 다듬어줘"], preset:true},
  {id:"writer", name:"글쓰기 코치", desc:"이메일, 보고서, 자기소개서 초안과 퇴고.", system:"너는 글쓰기 코치다. 목적과 독자에 맞게 간결하고 구체적인 문장으로 쓴다.", starters:["사과 이메일 초안 써줘","블로그 제목 10개 추천: 제주 한 달 살기","이 글을 5줄로 요약해줘","자기소개서 첫 문단 써줘"], preset:true},
  {id:"tutor", name:"공부 튜터", desc:"단계별 풀이와 개념 설명.", system:"너는 인내심 있는 튜터다. 답만 주지 않고 단계별로 설명하고, 끝에 이해를 확인하는 질문을 하나 한다.", starters:["이차방정식 근의 공식 유도","광합성과 호흡 차이를 표로","임진왜란 원인과 결과 요약","현재완료와 과거시제 차이"], preset:true},
  {id:"docs", name:"내 문서 도우미", desc:"'내 지식'에 올린 문서를 근거로 답합니다.", system:"너는 사용자가 올린 문서를 근거로 답하는 도우미다. 참고 자료에 있는 내용만 근거로 삼고, 문서 이름을 밝힌다. 자료에 없으면 없다고 말한다.", starters:["내 문서에서 핵심 내용 요약해줘","문서에 나온 일정만 정리해줘","이 규정에서 휴가 관련 내용 찾아줘","문서끼리 다른 내용이 있는지 찾아줘"], preset:true, rag:true}
];
let customBots = ls.get("bots", []);
const allBots = () => [...PRESET_BOTS, ...customBots];
const botById = id => allBots().find(b => b.id === id) || PRESET_BOTS[0];

/* ============ 모델 카탈로그 ============ */
const CATALOG = [
  {id:"qwen3-1.7b", name:"Qwen3 1.7B", repo:"unsloth/Qwen3-1.7B-GGUF", quant:"Q4_K_M", gb:1.1, tags:["추천","다국어","깊게 생각 지원"], lic:"Apache-2.0", desc:"성능과 크기의 균형이 좋습니다. 한국어도 무난합니다."},
  {id:"exaone-2.4b", name:"EXAONE 3.5 2.4B", repo:"LGAI-EXAONE/EXAONE-3.5-2.4B-Instruct-GGUF", quant:"Q4_K_M", gb:1.6, tags:["한국어 특화"], lic:"EXAONE 라이선스(비상업)", desc:"LG AI연구원 모델. 한국어가 가장 자연스럽습니다. 상업적 사용은 제한됩니다."},
  {id:"qwen2.5-0.5b", name:"Qwen2.5 0.5B", repo:"Qwen/Qwen2.5-0.5B-Instruct-GGUF", quant:"Q4_K_M", gb:0.4, tags:["가장 가벼움","휴대폰"], lic:"Apache-2.0", desc:"저사양 기기와 휴대폰용. 빠르지만 답이 단순합니다."},
  {id:"qwen2.5-1.5b", name:"Qwen2.5 1.5B", repo:"Qwen/Qwen2.5-1.5B-Instruct-GGUF", quant:"Q4_K_M", gb:1.1, tags:["다국어"], lic:"Apache-2.0", desc:"생각 모드 없이 바로 답하는 안정적인 모델입니다."},
  {id:"r1-1.5b", name:"DeepSeek-R1 Distill 1.5B", repo:"unsloth/DeepSeek-R1-Distill-Qwen-1.5B-GGUF", quant:"Q4_K_M", gb:1.1, tags:["추론","수학"], lic:"MIT", desc:"항상 먼저 생각하고 답합니다. 수학·논리 문제용. 한국어는 약합니다."},
  {id:"gemma3-1b", name:"Gemma 3 1B", repo:"unsloth/gemma-3-1b-it-GGUF", quant:"Q4_K_M", gb:0.8, tags:["가벼움"], lic:"Gemma 약관", desc:"Google의 소형 모델입니다."},
  {id:"llama3.2-1b", name:"Llama 3.2 1B", repo:"bartowski/Llama-3.2-1B-Instruct-GGUF", quant:"Q4_K_M", gb:0.8, tags:["영어 강함"], lic:"Llama 3.2 커뮤니티", desc:"Meta의 소형 모델. 영어 대화에 강합니다."}
];

/* ============ 설정 ============ */
let settings = Object.assign({device:"auto", ctx:4096, maxTokens:1024, temp:0.7, think:false, rag:true, last:null, autoload:true,
  brain:"local", nvKey:"", nvModel:"qwen/qwen3-235b-a22b", olModel:"qwen3:14b", olOk:false}, ls.get("settings", {}));
const saveSettings = () => ls.set("settings", settings);

/* ============ 엔진 ============ */
const WASM = {default: new URL("./vendor/wllama/wllama.wasm", location.href).href};
const eng = {w:null, loaded:null, loading:false, progress:0, phase:"", error:"", gpu:false, threads:0, stats:null};
let probe = null;
function newWllama(){ return new Wllama(WASM, {suppressNativeLog:true, allowOffline:true, parallelDownloads:3}); }
function getProbe(){ return probe || (probe = newWllama()); }
const gpuSupported = () => { try { return getProbe().isSupportWebGPU(); } catch(e){ return false; } };

async function loadModel(src){
  if (eng.loading) return;
  eng.loading = true; eng.progress = 0; eng.error = ""; eng.phase = "준비 중"; refreshModelUI();
  try {
    if (eng.w){ try { await eng.w.exit(); } catch(e){} eng.w = null; eng.loaded = null; }
    const useGpu = settings.device === "gpu" || (settings.device === "auto" && gpuSupported());
    const attempt = async gpu => {

/* ============ 내 지식 (문서 검색, BM25) ============ */
let docs = [];
const idx = {chunks:[], df:new Map(), avg:1};
function tokenize(s){
  const out = []; const t = String(s).toLowerCase();
  for (const m of t.matchAll(/[가-힣]+|[a-z0-9]+|[぀-ヿ一-鿿]+/g)){
    const w = m[0];
    if (/^[a-z0-9]+$/.test(w)){ if (w.length >= 2) out.push(w); continue; }
    if (w.length === 1){ out.push(w); continue; }
    for (let i = 0; i < w.length - 1; i++) out.push(w.slice(i, i+2)); // 한글·한자는 두 글자 조각으로
  }
  return out;
}
function chunkText(text, size = 700, overlap = 120){
  const clean = text.replace(/\r/g, "").replace(/\n{3,}/g, "\n\n").trim();
  const paras = clean.split(/\n\s*\n/); const chunks = []; let cur = "";
  for (const p of paras){
    if ((cur + "\n\n" + p).length > size && cur){ chunks.push(cur); cur = cur.slice(-overlap) + "\n\n" + p; }
    else cur = cur ? cur + "\n\n" + p : p;
    while (cur.length > size * 1.6){ chunks.push(cur.slice(0, size)); cur = cur.slice(size - overlap); }
  }
  if (cur.trim()) chunks.push(cur);
  return chunks;
}
function rebuildIndex(){
  idx.chunks = []; idx.df = new Map(); let total = 0;
  for (const d of docs) d.chunks.forEach((text, i) => {
    const tf = new Map(); const toks = tokenize(d.name + " " + text);
    for (const t of toks) tf.set(t, (tf.get(t) || 0) + 1);
    for (const t of tf.keys()) idx.df.set(t, (idx.df.get(t) || 0) + 1);
    idx.chunks.push({doc:d.id, name:d.name, i, text, tf, len:toks.length}); total += toks.length;
  });
  idx.avg = idx.chunks.length ? total / idx.chunks.length : 1;
}
function search(q, k = 4){
  const qt = [...new Set(tokenize(q))]; if (!qt.length || !idx.chunks.length) return [];
  const N = idx.chunks.length, k1 = 1.2, b = 0.75;
  const scored = idx.chunks.map(c => {
    let s = 0;
    for (const t of qt){ const f = c.tf.get(t); if (!f) continue; const df = idx.df.get(t) || 0; const idf = Math.log(1 + (N - df + .5)/(df + .5)); s += idf * f * (k1+1) / (f + k1*(1 - b + b*c.len/idx.avg)); }
    return {c, s};
  }).filter(x => x.s > 0).sort((a,b) => b.s - a.s);
  if (!scored.length) return [];
  const top = scored[0].s;
  return scored.filter(x => x.s >= top * 0.35).slice(0, k).map(x => ({...x.c, score:x.s}));
}

/* ============ 마크다운 ============ */
function inline(s){
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length-1) + "\u0000"; });
  s = esc(s);
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>").replace(/__([^_\n]+)__/g, "<strong>$1</strong>")
       .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>").replace(/~~([^~\n]+)~~/g, "<del>$1</del>")
       .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[+i]) + "</code>");
}
function md(src){
  const lines = String(src).replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  const isSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  const blockStart = /^(#{1,6}\s|\s*```|\s*~~~|\s*>|\s*([-*+]|\d+[.)])\s)/;
  while (i < lines.length){
    const l = lines[i];
    const fence = l.match(/^\s*(```|~~~)\s*([\w+#.-]*)/);
    if (fence){
      const buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence[1])) buf.push(lines[i++]);
      i++;
      out.push(`<div class="codebox"><div class="bar"><span>${esc(fence[2] || "code")}</span><button data-copy>복사</button></div><pre><code>${esc(buf.join("\n"))}</code></pre></div>`);
      continue;
    }
    if (/^\s*$/.test(l)){ i++; continue; }
    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if (h){ const n = Math.min(4, h[1].length); out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if (l.includes("|") && i+1 < lines.length && isSep(lines[i+1])){
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^\s*>/.test(l)){ const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, "")); out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`); continue; }
    const li = l.match(/^(\s*)([-*+]|\d+[.)])\s+/);
    if (li){
      const ordered = /\d/.test(li[2]), items = [];
      while (i < lines.length){
        const m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (m && m[1].length <= li[1].length + 1){ items.push([m[3]]); i++; continue; }
        if (items.length && /^\s{2,}\S/.test(lines[i])){ items[items.length-1].push(lines[i].trim()); i++; continue; }
        break;
      }
      out.push(`<${ordered?"ol":"ul"}>${items.map(it => `<li>${it.length > 1 && /^([-*+]|\d+[.)])\s/.test(it[1]) ? inline(it[0]) + md(it.slice(1).join("\n")) : inline(it.join(" "))}</li>`).join("")}</${ordered?"ol":"ul"}>`);
      continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !blockStart.test(lines[i]) && !(lines[i].includes("|") && i+1 < lines.length && isSep(lines[i+1]))) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out.push(`<p>${buf.map(inline).join("<br>")}</p>`);
  }
  return out.join("");
}
function splitThink(text){
  const t = String(text || ""), s = t.indexOf("<think>");
  if (s === -1){ const e0 = t.indexOf("</think>"); return e0 === -1 ? {think:"", body:t} : {think:t.slice(0, e0).trim(), body:t.slice(e0+8).trim()}; }
  const e = t.indexOf("</think>", s);
  if (e === -1) return {think:t.slice(s+7), body:t.slice(0, s), open:true};
  return {think:t.slice(s+7, e).trim(), body:(t.slice(0, s) + t.slice(e+8)).trim()};
}

const approxTokens = s => Math.ceil(s.length / 1.6);   // 한국어 기준 대략 추정
const ctxSize = () => eng.ctx || settings.ctx;                 // 모델이 실제로 잡은 기억 길이
const answerLen = () => Math.min(settings.maxTokens, Math.floor(ctxSize() / 3));
function buildMessages(){
  const bot = botById(current.botId), d = new Date();
  const lastUser = [...current.messages].reverse().find(m => m.role === "user");
  let system = `${bot.system}\n\n${BASE_RULES}\n오늘 날짜: ${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일.`;
  let sources = [];
  if ((settings.rag || bot.rag) && docs.length && lastUser){
    const hits = search(lastUser.content + " " + (lastUser.attach||[]).map(a => a.name).join(" "), 4);
    if (hits.length){
      let budget = Math.max(300, Math.floor(brainCtx() * 0.3 * 1.6));
      const parts = [];
      for (const h of hits){ const t = h.text.slice(0, budget); if (t.length < 80 && parts.length) break; parts.push(`[${parts.length+1}] 문서: ${h.name}\n${t}`); budget -= t.length; if (budget <= 0) break; }
      system += `\n\n다음은 사용자가 올린 문서에서 찾은 참고 자료다. 질문과 관련 있으면 이 자료를 근거로 답하고 "(문서: 이름)" 형식으로 출처를 밝혀라. 관련이 없으면 무시하라.\n\n${parts.join("\n\n")}`;
      sources = [...new Set(hits.slice(0, parts.length).map(h => h.name))];
    }
  }
  // 대화 기억 길이(n_ctx) 안에 들어가도록 최근 대화부터 채움
  let budget = brainCtx() - brainAnswerLen() - approxTokens(system) - 64;
  const msgs = [];
  for (let i = current.messages.length - 1; i >= 0; i--){
    const m = current.messages[i];
    let c = m.role === "assistant" ? splitThink(m.content).body : m.content;
    if (!c) continue;
    if (m.attach){
      const room = Math.max(400, Math.floor(budget * 1.6) - c.length - 200);
      c += m.attach.map(a => { const t = a.text.slice(0, Math.floor(room / m.attach.length)); return `\n\n[첨부 파일: ${a.name}${t.length < a.text.length ? ` · 앞부분 ${fmtN(t.length)}자만 포함` : ""}]\n${t}`; }).join("");
    }
    const cost = approxTokens(c) + 8;
    if (cost > budget){ if (!msgs.length){ c = c.slice(0, Math.max(200, Math.floor(budget * 1.6))); msgs.unshift({role: m.role === "assistant" ? "assistant" : "user", content: c}); } break; }
    budget -= cost;
    msgs.unshift({role: m.role === "assistant" ? "assistant" : "user", content: c});
  }
  while (msgs.length && msgs[0].role !== "user") msgs.shift();
  const merged = msgs.reduce((acc, m) => { const last = acc[acc.length-1]; if (last && last.role === m.role) last.content += "\n\n" + m.content; else acc.push({...m}); return acc; }, []);
  return {messages: [{role:"system", content: system}, ...merged], sources};
}
async function run(){
  const out = {role:"assistant", content:"", model: brainLabel(), brain: settings.brain, ts: Date.now(), streaming: true, phase: "질문을 읽는 중…"};
  current.messages.push(out);
  const i = current.messages.length - 1;
  busy = true; updateSend(); renderChat(); scrollDown(true);
  ctl = new AbortController();
  const t0 = performance.now(); let raf = 0;
  const paint = () => { raf = 0; const el = $(`#msgs .m[data-i="${i}"]`); if (el){ el.outerHTML = msgHTML(out, i); scrollDown(); } };
  const bump = () => { if (!raf) raf = requestAnimationFrame(paint); };
  try {
    const {messages, sources} = buildMessages();
    out.sources = sources;
    let cut = false;
    await brainStream({messages, maxTokens: brainAnswerLen(), temperature: botById(current.botId).temp ?? settings.temp, signal: ctl.signal, think: settings.think,
      onContent: d => { out.content += d; bump(); }, onThink: d => { out.think = (out.think || "") + d; bump(); },
      onStats: st => { if (st.tps) out.tps = st.tps; if (st.cut) cut = true; }});
    if (cut) out.content += "\n\n*(답변 길이 한도에 닿아 끊겼습니다. '계속'이라고 보내면 이어서 씁니다.)*";
    if (!out.content.trim() && !out.think) out.error = "빈 답변이 나왔습니다. 다시 생성해 보세요.";
  } catch (e){
    if (e && (e.name === "AbortError" || e.name === "WllamaAbortError" || ctl.signal.aborted)){ if (!out.content) out.error = "답변을 멈췄습니다."; }
    else { const msg = String(e && e.message || e); out.error = /context|n_ctx|exceed/i.test(msg) ? "대화가 너무 길어 기억 한도를 넘었습니다. 새 대화를 시작하거나 'AI 모델 > 대화 기억 길이'를 늘리세요." : "답변 중 오류: " + msg.slice(0, 200); }
  } finally {
    cancelAnimationFrame(raf);
    out.streaming = false; out.ms = Math.round(performance.now() - t0); delete out.phase;
    busy = false; ctl = null;
    saveChat(current); renderList(); updateSend(); paint(); scrollDown();
  }
}

$("#modelsPage").addEventListener("click", async e => {

      else { const r = await fetch(apiBase("ollama") + "/api/tags"); if (!r.ok) throw new Error("Ollama 응답 오류 " + r.status); names = (await r.json()).models.map(m => m.name); settings.olOk = names.length > 0; saveSettings(); }
      const sel = $(t.id === "nv-list" ? "#nv-model" : "#ol-model"), curv = sel.value;
      if (!names.length){ toast(t.id === "ol-list" ? "받은 모델이 없습니다. Ollama 앱에서 모델을 먼저 받으세요." : "모델이 없습니다"); }
      else { sel.innerHTML = names.map(n => `<option${n === curv ? " selected" : ""}>${esc(n)}</option>`).join(""); if (!names.includes(curv)){ sel.value = names[0]; sel.dispatchEvent(new Event("change", {bubbles:true})); } toast(`모델 ${names.length}개`); }
    } catch(err){ toast(err instanceof TypeError ? (LAUNCHER.on ? (t.id === "ol-list" ? "Ollama가 꺼져 있습니다" : "연결 실패") : "NuriAI.exe로 실행해야 연결됩니다") : err.message); }
    finally { t.disabled = false; refreshModelUI(); }
  }
  if (t.id === "unload") unloadModel();
  if (t.id === "loadUrl"){ const url = $("#ggufUrl").value.trim(); if (!/^https?:\/\/.+\.gguf(\?.*)?$/i.test(url)){ toast(".gguf로 끝나는 주소를 넣으세요"); return; } loadModel({kind:"url", name: decodeURIComponent(url.split("/").pop().split("?")[0]).replace(/\.gguf$/i, ""), url}); }
  if (t.id === "loadHf"){ const repo = $("#hfRepo").value.trim(); if (!/^[\w.-]+\/[\w.-]+$/.test(repo)){ toast("저장소는 '사용자/이름' 형식으로 넣으세요"); return; } loadModel({kind:"hf", name: repo.split("/")[1].replace(/-GGUF$/i, ""), repo, quant: $("#hfQuant").value.trim() || "Q4_K_M"}); }
  if (t.dataset.rmcache){
    if (t.dataset.confirm !== "1"){ t.dataset.confirm = "1"; t.textContent = "정말 삭제"; return; }
    try { await getProbe().cacheManager.delete(t.dataset.rmcache); } catch(err){}

function renderDash(){

  const today = new Date(); today.setHours(0,0,0,0);
  const avgMs = ais.length ? ais.reduce((a,m) => a + m.ms, 0) / ais.length : 0;
  const tpsList = ais.filter(m => m.tps).map(m => m.tps);
  const cps = ais.filter(m => m.content).map(m => splitThink(m.content).body.length / (m.ms/1000));
  const days = [...Array(14)].map((_, i) => { const d = new Date(+today - (13-i)*864e5); return {d, n: users.filter(m => m.ts >= +d && m.ts < +d + 864e5).length}; });
  const cnt = (arr, f) => arr.reduce((o, m) => { const k = f(m); if (k) o[k] = (o[k]||0) + 1; return o; }, {});
  const hb = (obj, lab) => { const e = Object.entries(obj).sort((a,b) => b[1]-a[1]).slice(0, 8); const mx = Math.max(1, ...e.map(x => x[1])); return e.length ? e.map(([k,v]) => `<div class="hbar"><span title="${esc(lab(k))}">${esc(lab(k))}</span><span class="track"><i style="width:${v/mx*100}%"></i></span><span class="num">${fmtN(v)}</span></div>`).join("") : `<p class="empty">아직 기록이 없습니다.</p>`; };

      <div class="kpi"><label>생성 속도</label><span class="v">${tpsList.length ? (tpsList.reduce((a,b)=>a+b,0)/tpsList.length).toFixed(1) : cps.length ? Math.round(cps.reduce((a,b)=>a+b,0)/cps.length) : "–"}</span><span class="s">${tpsList.length ? "토큰/초 평균" : "글자/초 평균"}</span></div>
      <div class="kpi"><label>내 지식</label><span class="v">${fmtN(docs.length)}</span><span class="s">문서 · 조각 ${fmtN(docs.reduce((a,d) => a + d.chunks.length, 0))}개</span></div>
      <div class="kpi"><label>AI 두뇌</label><span class="v" style="font-size:16px;font-family:var(--f-body);font-weight:700">${esc(brainReady() ? brainLabel() : "설정 필요")}</span><span class="s">${esc(BRAINS[settings.brain].name)}</span></div>
      ${Object.entries(trade.summary()).map(([ex, a]) => `<div class="kpi"><label>모의투자 · ${ex === "upbit" ? "업비트" : "바이낸스"}</label><span class="v ${a.total >= a.start ? "up" : "down"}">${(a.total / a.start * 100 - 100 >= 0 ? "+" : "") + (a.total / a.start * 100 - 100).toFixed(2)}%</span><span class="s">거래 ${a.trades}회 · 매수가 기준</span></div>`).join("")}
    </div>

      <div class="card"><h3>최근 14일 질문 수 <small>하루 단위</small></h3><div class="body"><div class="chart" id="dayChart"></div></div></div>
      <div class="card"><h3>모델별 답변</h3><div class="body">${hb(cnt(ais, m => m.model), k => k)}</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>최근 대화</h3><div class="body"><div class="list">${byUpdated().slice(0,8).map(c => `<button data-open="${c.id}"><span class="t">${esc(c.title)}</span><span class="num">${new Date(c.updated).toLocaleDateString("ko-KR",{month:"short",day:"numeric"})} · ${c.messages.length}개</span></button>`).join("") || `<p class="empty">첫 대화를 시작해 보세요.</p>`}</div></div></div>
      <div class="card"><h3>봇별 질문</h3><div class="body">${hb(cnt(users, m => m.botId), k => botById(k).name)}</div></div>
    </div>`;
  drawBars($("#dayChart"), days);
}
function drawBars(el, days){
  const W = 560, H = 200, pl = 30, pr = 8, pt = 12, pb = 26;
  const mx = Math.max(...days.map(d => d.n));
  const step = mx <= 4 ? 1 : mx <= 10 ? 2 : mx <= 25 ? 5 : Math.ceil(mx/25)*5;
  const top = Math.max(step, Math.ceil(mx/step)*step);
  const y = v => pt + (H - pt - pb) * (1 - v/top), bw = (W - pl - pr) / days.length;
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"${v ? ' stroke-dasharray="2 3"' : ""}/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${v}</text>`;
  days.forEach((d, i) => {
    const x = pl + i*bw + 3, w = bw - 6, h = y(0) - y(d.n), last = i === days.length - 1;
    if (d.n) g += `<path d="M${x},${y(0)} v${-(h-3)} q0,-3 3,-3 h${w-6} q3,0 3,3 v${h-3} z" fill="var(--accent)" opacity="${last ? 1 : .72}"/>`;
    g += `<rect x="${pl + i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent" data-i="${i}"/>`;
    if (i % 2 === 1 || last) g += `<text x="${x + w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.d.getMonth()+1}/${d.d.getDate()}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 14일 하루 질문 수">${g}</svg><div class="tip" hidden></div>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  svg.addEventListener("pointermove", e => {
    const r = e.target.closest("rect[data-i]"); if (!r){ tip.hidden = true; return; }
    const d = days[+r.dataset.i], box = el.getBoundingClientRect(), rb = r.getBoundingClientRect();
    tip.hidden = false; tip.textContent = `${d.d.getMonth()+1}월 ${d.d.getDate()}일 · 질문 ${d.n}개`;
    tip.style.left = (rb.left - box.left + rb.width/2) + "px"; tip.style.top = (y(d.n)/H*box.height) + "px";
  });
  svg.addEventListener("pointerleave", () => tip.hidden = true);
}
$("#dash").addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b){ openChat(b.dataset.open); go("chat"); } });

/* ============ 화면 전환 ============ */
async function go(v){
  try { localStorage.setItem("nuri:view", v); } catch(e){}
  for (const s of ["chat","trade","arch","models","know","bots","dash"]) $("#v-" + s).hidden = s !== v;
  if (v === "trade") trade.show(); else trade.hide();
  if (v === "arch" && !$("#archFrame").src) $("#archFrame").src = "../arch-ai/";
  $$(".rail-nav [data-go]").forEach(b => b.dataset.go === v ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  $("#title").textContent = v === "chat" ? current.title : {trade:"코인 트레이딩", arch:"건축 설계 AI", models:"AI 두뇌와 모델", know:"내 지식", bots:"내 봇 만들기", dash:"대시보드"}[v];
  $("#botSel").hidden = v !== "chat";
  $("#app").classList.remove("open");
  if (v === "chat") renderChat();
  if (v === "models"){ await refreshCache(); renderModels(); }
  if (v === "know") renderKnow();
  if (v === "bots") renderBots();
  if (v === "dash") renderDash();
}
$$(".rail-nav [data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
$("#menuBtn").onclick = () => $("#app").classList.toggle("open");
$("#scrim").onclick = () => $("#app").classList.remove("open");

/* ============ 코인 트레이딩 ============ */
const trade = initTrade({root: $("#tradePage"), brain: window.NuriBrain, apiBase, toast, md, esc, ls, launcher: () => LAUNCHER.on});

/* ============ 시작 ============ */
(async () => {
  await detectLauncher();
  renderBotSel(); newChat("general"); refreshModelUI();
  const [c, d] = await Promise.all([idb.all("chat:"), idb.all("doc:")]);
  chats = c; docs = d; rebuildIndex(); renderList();
  const views = ["trade","arch","models","know","bots","dash"];
  const h = location.hash.slice(1), lastView = (() => { try { return localStorage.getItem("nuri:view"); } catch(e){ return null; } })();
  if (views.includes(h)) go(h); else if (views.includes(lastView)) go(lastView);
  if (settings.autoload && settings.last && !window.__nuriNoAutoload) loadModel(settings.last);
})();

// 서비스 워커: 오프라인 실행 + 멀티스레드용 격리 헤더
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.__nuriNoSW){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("./sw.js", {updateViaCache: "none"}).then(reg => {
    const flag = "nuri:coi-reload";
    const maybeReload = () => { if (!self.crossOriginIsolated && !sessionStorage.getItem(flag) && !eng.loading && !busy){ sessionStorage.setItem(flag, "1"); location.reload(); } };
    if (navigator.serviceWorker.controller) maybeReload();
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      // 새 버전 서비스 워커가 자리 잡으면(업데이트) 화면을 한 번 새로 불러 최신 파일로 맞춘다
      if (hadController && !sessionStorage.getItem("nuri:sw-updated") && !eng.loading && !busy){ sessionStorage.setItem("nuri:sw-updated", "1"); location.reload(); }
      else maybeReload();
    });
    reg.update().catch(() => {});
  }).catch(() => {});
}
window.__nuri = {md, splitThink, search, tokenize, chunkText, eng, trade, LAUNCHER, get settings(){ return settings; }, get chats(){ return chats; }, get docs(){ return docs; }};
</script>
