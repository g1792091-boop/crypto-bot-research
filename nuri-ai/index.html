<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>누리 AI</title>
<meta name="description" content="채팅과 코드, 두 가지 모드로 무엇이든 하는 나만의 AI">
<meta name="theme-color" content="#FAF9F6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Layout: collapsible left rail · conversation column (max 760px) · optional artifact panel on the right; greeting + centered composer when empty */
:root{
  --bg:#FAF9F6; --side:#F3F1EB; --panel:#FFFFFF; --panel-2:#F1EEE7; --ink:#25231F; --muted:#77726A; --line:#E5E1D7; --line-2:#D6D1C5;
  --accent:#C4663C; --accent-soft:#F6E7DE; --accent-ink:#FFFFFF; --user:#EFECE4;
  --code-bg:#F6F4EF; --code-ink:#2B2925; --tok-k:#A0412D; --tok-s:#3B7A4B; --tok-c:#8E887E; --tok-n:#8A4FB0;
  --ok:#2F7D4B; --warn:#A8691A; --bad:#B53A2F; --add:#E5F3E7; --add-ink:#22663A; --del:#FBE7E4; --del-ink:#A1352B;
  --up:#D23B35; --down:#2563D9; --ma1:#D99414; --ma2:#8B55D6; --ma3:#1F9E8F;
  --f-body:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-serif:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang","바탕",Georgia,serif;
  --f-mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,"D2Coding",monospace;
  --r:12px; --panel-w:48%; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#262522; --side:#1F1E1C; --panel:#2E2D2A; --panel-2:#34332F; --ink:#ECEAE4; --muted:#A39E95; --line:#3A3935; --line-2:#4A4844;
  --accent:#E0805A; --accent-soft:#3D2C24; --accent-ink:#1F1A16; --user:#3A3834;
  --code-bg:#1E1D1B; --code-ink:#E8E6E1; --tok-k:#F09A7A; --tok-s:#9BD09E; --tok-c:#8A857C; --tok-n:#C9A1F0;
  --ok:#5DBE80; --warn:#E0A64E; --bad:#E57B6E; --add:#1F3324; --add-ink:#9BD8A8; --del:#3D2220; --del-ink:#F0A39A;
  --up:#F0605A; --down:#5B8DEF; --ma1:#F2B84B; --ma2:#B08CF0; --ma3:#4CC7B6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262522; --side:#1F1E1C; --panel:#2E2D2A; --panel-2:#34332F; --ink:#ECEAE4; --muted:#A39E95; --line:#3A3935; --line-2:#4A4844;
  --accent:#E0805A; --accent-soft:#3D2C24; --accent-ink:#1F1A16; --user:#3A3834;
  --code-bg:#1E1D1B; --code-ink:#E8E6E1; --tok-k:#F09A7A; --tok-s:#9BD09E; --tok-c:#8A857C; --tok-n:#C9A1F0;
  --ok:#5DBE80; --warn:#E0A64E; --bad:#E57B6E; --add:#1F3324; --add-ink:#9BD8A8; --del:#3D2220; --del-ink:#F0A39A;
  --up:#F0605A; --down:#5B8DEF; --ma1:#F2B84B; --ma2:#B08CF0; --ma3:#4CC7B6; color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.65;padding-top:env(safe-area-inset-top,0px);box-sizing:border-box;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- 틀 ---------- */
.app{display:flex;height:100%}
.side{width:268px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:margin-left .2s ease}
.app.collapsed .side{margin-left:-268px}
.side-top{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.ib{border:0;background:transparent;border-radius:8px;padding:6px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib:hover{background:var(--panel-2);color:var(--ink)}
.side .new{margin:6px 10px;display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:8px 10px;font-weight:600;color:var(--ink)}
.side .new:hover{background:var(--panel-2)}
.side .new .plus{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.side-search{padding:2px 10px 6px}
.side-search input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px;font-size:13.5px}
.recents{flex:1;overflow:auto;padding:0 8px 8px;min-height:0}
.grp{font-size:12px;color:var(--muted);padding:12px 8px 4px;font-weight:600}
.ci{display:flex;align-items:center;gap:6px;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:14px}
.ci:hover{background:var(--panel-2)}
.ci[aria-current="true"]{background:var(--panel-2);font-weight:600}
.ci .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .tag{font-size:10.5px;border:1px solid var(--line-2);border-radius:5px;padding:0 5px;color:var(--muted);font-weight:500;background:transparent}
.ci .del{opacity:0;border:0;background:transparent;color:var(--muted);padding:0 2px;font-size:12px}
.ci:hover .del,.ci:focus-within .del{opacity:1}
.side-bottom{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px}
.side-bottom button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:8px;padding:8px 10px;color:var(--ink);text-align:left;font-size:14px}
.side-bottom button:hover{background:var(--panel-2)}
.side-note{font-size:11.5px;color:var(--muted);padding:4px 10px 2px}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:52px}
.modes{display:inline-flex;background:var(--panel-2);border-radius:10px;padding:3px;gap:2px}
.modes button{border:0;background:transparent;border-radius:8px;padding:5px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.top .title{flex:1;min-width:0;text-align:center;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.top-right{display:flex;gap:6px;align-items:center}
.split{flex:1;display:flex;min-height:0}
.convo{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.scroll{flex:1;overflow:auto;min-height:0}
.thread{max-width:760px;margin:0 auto;padding-block:8px 24px;padding-inline:20px;display:flex;flex-direction:column;gap:26px;min-height:100%}
.dock{padding:0 20px calc(14px + env(safe-area-inset-bottom,0px))}
.dock .composer{max-width:760px;margin:0 auto}
.dock-note{max-width:760px;margin:6px auto 0;text-align:center;font-size:11.5px;color:var(--muted)}

/* ---------- 첫 화면 ---------- */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:24px 0 8vh}
.hero h1{font-family:var(--f-serif);font-weight:400;font-size:clamp(28px,4.4vw,40px);letter-spacing:-.01em;margin:0;text-align:center;text-wrap:balance;display:flex;align-items:center;gap:14px}
.hero h1 .logo{width:34px;height:34px;font-size:17px;border-radius:10px;font-family:var(--f-body)}
.hero-slot{width:100%;max-width:700px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:700px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;font-size:13.5px;color:var(--ink);display:inline-flex;gap:7px;align-items:center}
.chip:hover{border-color:var(--line-2);background:var(--panel-2)}
.chip svg.i{width:16px;height:16px;color:var(--muted)}
.hero-note{font-size:13px;color:var(--muted);text-align:center;max-width:560px}
.hero-note b{color:var(--ink)}

/* ---------- 입력창 ---------- */
.composer{background:var(--panel);border:1px solid var(--line-2);border-radius:18px;padding:10px 10px 8px 14px;box-shadow:0 2px 10px rgba(30,25,15,.05);display:flex;flex-direction:column;gap:6px}
.composer:focus-within{border-color:var(--muted)}
.composer textarea{border:0;background:transparent;resize:none;outline:none;min-height:28px;max-height:240px;padding:4px 2px;width:100%;font-size:15.5px;line-height:1.55}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crow .sp{flex:1}
.cbtn{border:1px solid var(--line);background:transparent;border-radius:9px;padding:5px 9px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer;max-width:240px}
.cbtn:hover{background:var(--panel-2);color:var(--ink)}
.cbtn[aria-pressed="true"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
.cbtn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn.icon{padding:5px 7px}
select.cbtn{padding-right:6px}
.send{width:34px;height:34px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.send:disabled{opacity:.4;cursor:default}
.send.stop{background:var(--ink);color:var(--bg)}
.files{display:flex;gap:6px;flex-wrap:wrap}
.fchip{font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;color:var(--muted);background:var(--panel-2);display:inline-flex;gap:6px;align-items:center}
.fchip button{border:0;background:transparent;color:var(--muted);padding:0}
.pick{position:relative}
.menu{position:absolute;bottom:calc(100% + 6px);right:0;min-width:300px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;z-index:30;display:flex;flex-direction:column;gap:2px}
.menu.left{right:auto;left:0}
.menu button.mi{display:flex;align-items:flex-start;gap:10px;border:0;background:transparent;border-radius:8px;padding:8px 10px;text-align:left}
.menu button.mi:hover{background:var(--panel-2)}
.menu .mi b{display:block;font-size:14px}
.menu .mi span{font-size:12px;color:var(--muted)}
.menu .mi .ck{width:16px;color:var(--accent);flex:none;margin-top:2px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;font-size:13px;width:100%}

/* ---------- 메시지 ---------- */
.msg{display:flex;flex-direction:column;gap:8px;min-width:0}
.msg.user{align-items:flex-end}
.bubble{background:var(--user);border-radius:16px;padding:9px 15px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.msg.ai{align-items:stretch}
.md{min-width:0;word-break:break-word}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:.6em 0}
.md h1,.md h2,.md h3,.md h4{margin:1.1em 0 .45em;line-height:1.35;text-wrap:balance}
.md h1{font-size:1.3em}.md h2{font-size:1.17em}.md h3{font-size:1.05em}
.md ul,.md ol{padding-left:1.4em;margin:.5em 0}
.md li{margin:.25em 0}
.md blockquote{margin:.6em 0;padding:.1em 1em;border-left:3px solid var(--line-2);color:var(--muted)}
.md code{font-family:var(--f-mono);font-size:.86em;background:var(--panel-2);padding:.12em .38em;border-radius:5px}
.md a{color:var(--accent)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.md .tbl{overflow-x:auto;margin:.7em 0}
.md table{border-collapse:collapse;font-size:.93em;min-width:60%}
.md th,.md td{border:1px solid var(--line);padding:6px 11px;text-align:left}
.md th{background:var(--panel-2)}
.codebox{margin:.7em 0;border-radius:10px;overflow:hidden;background:var(--code-bg);border:1px solid var(--line)}
.codebox .bar{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;font-size:12px;color:var(--muted);font-family:var(--f-mono);border-bottom:1px solid var(--line)}
.codebox .bar button{border:0;background:transparent;color:var(--muted);font-size:12px}
.codebox pre,.art-code pre{margin:0;padding:12px 14px;overflow:auto;color:var(--code-ink);font-family:var(--f-mono);font-size:13px;line-height:1.6}
.codebox pre code{background:transparent;padding:0;font-size:inherit}
.k{color:var(--tok-k)}.s{color:var(--tok-s)}.c{color:var(--tok-c);font-style:italic}.n{color:var(--tok-n)}
details.think{border-left:2px solid var(--line-2);padding:2px 0 2px 12px;font-size:13.5px;color:var(--muted)}
details.think summary{cursor:pointer;list-style:none}
details.think summary::before{content:"▸ "}
details.think[open] summary::before{content:"▾ "}
details.think .tt{white-space:pre-wrap;margin-top:6px;max-height:280px;overflow:auto}
.cursor{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.8)}}
.acts{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.acts button{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:3px 7px;border-radius:6px;display:inline-flex;gap:5px;align-items:center}
.acts button:hover{background:var(--panel-2);color:var(--ink)}
.acts .meta{font-size:12px;color:var(--muted);margin-left:6px}
.err{border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent);border-radius:10px;padding:9px 13px;font-size:14px}

/* 도구 (채팅 모드) */
.tool{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;font-size:13.5px}
.tool-h{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:8px 12px;text-align:left;color:var(--ink)}
.st{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700}
.st.run{border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
.st.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.st.error,.st.denied{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.st.pending{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
@keyframes spin{to{transform:rotate(360deg)}}
.tool-h .nm{font-weight:600;white-space:nowrap}
.tool-h .sm{color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-b{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.tool-b pre{margin:0;font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;color:var(--muted)}
.tool-b label{font-size:11.5px;color:var(--muted);font-weight:600}
.art-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 12px;text-align:left;width:100%;max-width:440px;color:var(--ink)}
.art-card:hover{border-color:var(--line-2);background:var(--panel-2)}
.art-card .ic{width:40px;height:40px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;color:var(--muted);flex:none;border:1px solid var(--line)}
.art-card b{display:block;font-size:14px}
.art-card span{font-size:12.5px;color:var(--muted)}

/* 코드 모드 기록 (터미널 느낌) */
.cc{font-family:var(--f-mono);font-size:13px;display:flex;flex-direction:column;gap:3px}
.cc-h{display:flex;gap:8px;align-items:baseline;min-width:0}
.cc-h .dt{color:var(--ok)}
.cc-h .dt.run{color:var(--accent);animation:pulse 1s infinite}
.cc-h .dt.error,.cc-h .dt.denied{color:var(--bad)}
.cc-h .dt.pending{color:var(--warn)}
.cc-h b{font-weight:700;white-space:nowrap}
.cc-h .arg{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cc-r{color:var(--muted);padding-left:18px;white-space:pre-wrap}
.cc-r::before{content:"⎿  ";color:var(--line-2)}
.cc-out{margin:2px 0 0 18px;border:1px solid var(--line);border-radius:8px;background:var(--code-bg);padding:8px 10px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;color:var(--code-ink)}
.diff{margin:4px 0 0 18px;border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:420px;background:var(--code-bg)}
.diff .fn{padding:5px 10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;background:var(--panel)}
.diff .ln{display:grid;grid-template-columns:44px 18px 1fr;white-space:pre-wrap;word-break:break-all;padding:0 8px 0 0}
.diff .ln .no{color:var(--muted);text-align:right;padding-right:6px;opacity:.7}
.diff .ln.add{background:var(--add);color:var(--add-ink)}
.diff .ln.del{background:var(--del);color:var(--del-ink)}
.diff .gap{color:var(--muted);padding:2px 10px}
.todos{margin:4px 0 0 18px;display:flex;flex-direction:column;gap:2px}
.todos .td.completed{color:var(--muted);text-decoration:line-through}
.todos .td.in_progress{color:var(--accent);font-weight:600}
.perm{margin:6px 0 0 18px;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-family:var(--f-body);font-size:14px}

/* ---------- 결과물 패널 ---------- */
.panel{width:var(--panel-w);min-width:380px;max-width:72%;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0;position:relative}
.drag{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);min-height:52px}
.ph .pt{flex:1;min-width:0;display:flex;flex-direction:column}
.ph .pt b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .pt span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pb{flex:1;min-height:0;overflow:auto;position:relative;background:var(--bg);display:flex;flex-direction:column}
#pContent{flex:1;min-height:0;display:flex;flex-direction:column}
#pContent iframe{border:0;width:100%;flex:1;display:block;background:#fff}
.art-md{max-width:760px;margin:0 auto;padding:24px 28px}
.art-code{flex:1;background:var(--code-bg)}
.art-code .lnum{display:grid;grid-template-columns:auto 1fr}
.art-code .g{color:var(--muted);text-align:right;padding:12px 10px 12px 14px;user-select:none;font-family:var(--f-mono);font-size:13px;line-height:1.6;opacity:.6;white-space:pre}
.trade-host{container-type:inline-size;container-name:trade;padding:14px}
.arch-host{flex:1;display:flex}
.arch-host iframe{border:0;flex:1;width:100%;background:var(--bg)}

/* ---------- 공용 부품 (설정, 트레이딩 룸) ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.card h3{font-size:14px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.card .body{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:2px}
.kpi label{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:20px;font-weight:500}
.kpi .s{font-size:11.5px;color:var(--muted)}
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:9px;padding:6px 12px;font-size:13.5px;font-weight:500;cursor:pointer;display:inline-block;color:var(--ink)}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--panel)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.search,.sel{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:13px}
.search{width:100%}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.form .wide{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:14px;width:100%}
.form textarea{resize:vertical;min-height:110px}
.progress{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.small{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;margin:0}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tag{font-size:11px;padding:1px 8px;border-radius:9px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:9px 2px;min-width:0}
.list>:last-child{border-bottom:0}
.list .t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;flex:1}
/* ---------- 코인 트레이딩 ---------- */
.up{color:var(--up)!important} .down{color:var(--down)!important}
.pill.up{border-color:color-mix(in srgb,var(--up) 45%,transparent);background:color-mix(in srgb,var(--up) 10%,transparent)}
.pill.down{border-color:color-mix(in srgb,var(--down) 45%,transparent);background:color-mix(in srgb,var(--down) 10%,transparent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tr{display:flex;flex-direction:column;gap:14px}
.tr-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tr-title{display:flex;align-items:center;gap:12px}
.tr-title b{font-size:19px;letter-spacing:-.01em}
.tr-price{display:flex;align-items:baseline;gap:10px}
#tr-px{font-size:28px;font-weight:600;letter-spacing:-.02em}
.chg{font-size:14px;font-weight:600}
.tr-stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-left:auto}
.tr-stats div{display:flex;flex-direction:column}
.tr-stats label{font-size:11px;color:var(--muted)}
.tr-stats span{font-size:14px}
.tr-grid{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;gap:14px;align-items:start}
.tr-list .body{max-height:640px}
.tr-rows{display:flex;flex-direction:column;overflow:auto;max-height:580px;margin:0 -4px}
.tr-row{display:grid;grid-template-columns:minmax(0,1fr) auto 58px;gap:8px;align-items:center;border:0;background:transparent;padding:7px 6px;border-radius:6px;text-align:left;font-size:12.5px}
.tr-row:hover{background:var(--panel-2)}
.tr-row.on{background:var(--accent-soft)}
.tr-row .nm{display:flex;flex-direction:column;min-width:0}
.tr-row .nm b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-row .chg{font-size:12px;text-align:right;font-weight:500}
.tr-chart{overflow:hidden}
.tr-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.tr-tools .small{margin-left:auto}
.tr-canvas{position:relative;height:clamp(420px,62vh,640px)}
.tr-canvas canvas{display:block;touch-action:none;cursor:crosshair}
.tr-tip{position:absolute;top:10px;pointer-events:none;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:1px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.tr-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:20px;text-align:center}
.tr-msg-box{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;color:var(--ink)}
.tr-legend{display:flex;flex-wrap:wrap;gap:14px;padding:8px 12px;border-top:1px solid var(--line)}
.tr-legend i,.legend-row i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend-row{display:flex;flex-wrap:wrap;gap:14px}
.tr-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.gauge-top{display:flex;align-items:center;justify-content:space-between}
.gauge-v{font-size:34px;font-weight:600;letter-spacing:-.03em}
.gauge-bar{position:relative;height:10px;border-radius:5px;margin:8px 0 4px;background:linear-gradient(90deg,var(--down),var(--panel-2) 50%,var(--up))}
.gauge-bar i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-50%);box-shadow:0 0 0 2px var(--panel)}
.gauge-lab{display:flex;justify-content:space-between}
.factors{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.factor{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.factor:last-child{border-bottom:0}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lvls div{display:flex;flex-direction:column;gap:2px;font-size:13px}
.ai-wait{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-stream{margin:0;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:pre-wrap;max-height:140px;overflow:hidden}
.ai-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ai-head b{font-size:15px}
.ai-sum{margin:0;font-size:13.5px}
.scen{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scen>div{border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.scen p{margin:0}
.scen label{font-size:11px;font-weight:600}
.up-b{background:color-mix(in srgb,var(--up) 8%,transparent);border:1px solid color-mix(in srgb,var(--up) 25%,transparent)}
.down-b{background:color-mix(in srgb,var(--down) 8%,transparent);border:1px solid color-mix(in srgb,var(--down) 25%,transparent)}
.plan{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;font-size:12.5px}
.plan div{display:flex;flex-direction:column;gap:2px}
.plan label{font-size:11px;color:var(--muted)}
.risks{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.tr-bottom{overflow:hidden}
.tr-tabs{display:flex;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.tr-tabs button{border:0;background:transparent;padding:8px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tr-tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.bt-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px}
.bt-form,.bt-out{display:flex;flex-direction:column;gap:12px;min-width:0}
.bt-kpis{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.bt-kpis .v{font-size:20px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl{border-collapse:collapse;width:100%;font-size:12.5px;min-width:480px}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:11px;color:var(--muted);font-weight:500;background:var(--panel-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.order{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:8px;padding:12px}
.order .line{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pct-row .btn{flex:1;padding:5px 0}
.btn.buy{background:var(--up);border-color:var(--up);color:#fff}
.btn.sell{background:var(--down);border-color:var(--down);color:#fff}
.side-seg{width:100%}.side-seg button{flex:1;padding:8px}
.side-seg button[data-side="buy"][aria-pressed="true"]{background:var(--up);color:#fff}
.side-seg button[data-side="sell"][aria-pressed="true"]{background:var(--down);color:#fff}
.link{border:0;background:transparent;color:var(--accent);padding:0;font:inherit;text-decoration:underline}
.hist summary{cursor:pointer;margin-bottom:6px}
.tr-note{margin:0}
.brains{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.tile.brain p a,.tile.brain label a{color:var(--accent)}
h3.sec{font-size:15px;margin:6px 0 0;display:flex;gap:10px;align-items:baseline}
@container trade (max-width:1180px){.tr-grid{grid-template-columns:230px minmax(0,1fr)}.tr-side{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}}
@container trade (max-width:760px){.tr-grid{grid-template-columns:minmax(0,1fr)}.tr-side{grid-template-columns:minmax(0,1fr)}.tr-list .body,.tr-rows{max-height:260px}.bt-grid{grid-template-columns:minmax(0,1fr)}.tr-stats{margin-left:0}.tr-canvas{height:440px}.plan{grid-template-columns:1fr}}


/* ---------- 설정 ---------- */
dialog.sheet{border:0;padding:0;border-radius:16px;width:min(980px,calc(100% - 32px));height:min(780px,calc(100% - 40px));background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog.sheet::backdrop{background:rgba(20,18,15,.45)}
.sheet-in{display:flex;height:100%}
.sheet-nav{width:190px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:14px 8px;display:flex;flex-direction:column;gap:2px}
.sheet-nav h2{font-size:16px;margin:4px 10px 12px}
.sheet-nav button{border:0;background:transparent;text-align:left;border-radius:8px;padding:8px 10px;font-size:14px;color:var(--muted)}
.sheet-nav button[aria-current="true"]{background:var(--panel-2);color:var(--ink);font-weight:600}
.sheet-body{flex:1;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.sheet-body h3.h{font-size:17px;margin:0}
.sheet-body .sub{color:var(--muted);font-size:13.5px;margin:-8px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tile.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile .hd{display:flex;align-items:center;gap:10px;justify-content:space-between}
.tile b{font-size:15px}
.tile p{margin:0;font-size:13px;color:var(--muted);flex:1}
.tile .meta{display:flex;gap:6px;flex-wrap:wrap}
.tile a,.sheet-body a{color:var(--accent)}
.sheet-x{position:absolute;top:12px;right:12px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}
.scrim{display:none}

@media (max-width:980px){
  .panel{position:fixed;inset:0;width:100%!important;max-width:none;min-width:0;z-index:40;padding-top:env(safe-area-inset-top,0px)}
  .drag{display:none}
}
@media (max-width:760px){
  .side{position:fixed;inset:0 auto 0 0;z-index:35;margin-left:-280px;box-shadow:0 0 40px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px)}
  .app.open .side{margin-left:0}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:34}
  .app.collapsed .side{margin-left:-280px}
  .top .title{display:none}
  .thread{padding-inline:16px}
  .dock{padding-inline:12px}
  .sheet-in{flex-direction:column}
  .sheet-nav{width:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  .sheet-nav h2{display:none}
  .sheet-nav button{white-space:nowrap}
  .sheet-body{padding:16px}
  .form{grid-template-columns:1fr}
  .menu{min-width:270px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <aside class="side" aria-label="대화 목록">
    <div class="side-top">
      <span class="brand"><span class="logo">누</span>누리</span><span style="flex:1"></span>
      <button class="ib" id="sideClose" title="사이드바 접기" aria-label="사이드바 접기"><svg class="i"><use href="#i-side"/></svg></button>
    </div>
    <button class="new" id="newChat"><span class="plus"><svg class="i" style="width:16px;height:16px"><use href="#i-plus"/></svg></span>새 대화</button>
    <div class="side-search"><input id="search" type="search" placeholder="대화 검색" aria-label="대화 검색"></div>
    <div class="recents" id="recents"></div>
    <div class="side-bottom">
      <button id="openKnow"><svg class="i"><use href="#i-book"/></svg>내 지식</button>
      <button id="openSettings"><svg class="i"><use href="#i-gear"/></svg>설정</button>
      <div class="side-note">대화와 파일은 이 컴퓨터에만 저장됩니다</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <button class="ib" id="sideOpen" title="사이드바 열기" aria-label="사이드바 열기"><svg class="i"><use href="#i-side"/></svg></button>
      <div class="modes" role="tablist" aria-label="모드">
        <button role="tab" data-mode="chat" aria-selected="true">채팅</button>
        <button role="tab" data-mode="code" aria-selected="false">코드</button>
      </div>
      <div class="title" id="title"></div>
      <div class="top-right"><button class="ib" id="panelToggle" title="결과물 패널" aria-label="결과물 패널" hidden><svg class="i"><use href="#i-doc"/></svg></button></div>
    </header>
    <div class="split">
      <section class="convo" id="convo">
        <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
        <div class="dock" id="dock">
          <div class="composer" id="composer">
            <div class="files" id="pending"></div>
            <textarea id="input" rows="1" placeholder="누리에게 무엇이든 물어보세요" aria-label="메시지 입력"></textarea>
            <div class="crow">
              <label class="cbtn icon" for="fileIn" title="파일 첨부" aria-label="파일 첨부"><svg class="i"><use href="#i-plus"/></svg></label>
              <input type="file" id="fileIn" multiple hidden>
              <button class="cbtn" id="thinkBtn" aria-pressed="false" title="답하기 전에 더 깊게 생각합니다 (지원하는 모델)"><svg class="i" style="width:16px;height:16px"><use href="#i-bulb"/></svg><span class="lbl">깊게 생각</span></button>
              <span class="pick code-only" hidden><button class="cbtn" id="wsBtn" title="작업 폴더"><svg class="i" style="width:16px;height:16px"><use href="#i-folder"/></svg><span class="lbl" id="wsLabel">폴더 열기</span></button><div class="menu left" id="wsMenu" hidden></div></span>
              <select class="cbtn code-only" id="permSel" title="권한" aria-label="권한" hidden><option value="ask">매번 묻기</option><option value="edits">편집 자동 허용</option><option value="auto">모두 자동 허용</option></select>
              <span class="sp"></span>
              <span class="pick"><button class="cbtn" id="modelBtn"><span class="dot" id="modelDot"></span><span class="lbl" id="modelLabel">모델</span><svg class="i" style="width:14px;height:14px"><use href="#i-chev"/></svg></button><div class="menu" id="modelMenu" hidden></div></span>
              <button class="send" id="send" aria-label="보내기" disabled><svg class="i"><use href="#i-up"/></svg></button>
            </div>
          </div>
          <div class="dock-note" id="dockNote">누리는 실수할 수 있습니다. 중요한 정보는 확인하세요.</div>
        </div>
      </section>
      <aside class="panel" id="panel" hidden aria-label="결과물">
        <div class="drag" id="drag"></div>
        <div class="ph">
          <div class="pt"><b id="pTitle"></b><span id="pType"></span></div>
          <div class="seg" id="pView"><button data-v="preview" aria-pressed="true">미리보기</button><button data-v="code" aria-pressed="false">코드</button></div>
          <button class="ib" id="pCopy" title="복사" aria-label="복사"><svg class="i"><use href="#i-copy"/></svg></button>
          <button class="ib" id="pSave" title="파일로 저장" aria-label="파일로 저장"><svg class="i"><use href="#i-down"/></svg></button>
          <button class="ib" id="pClose" title="닫기" aria-label="닫기"><svg class="i"><use href="#i-x"/></svg></button>
        </div>
        <div class="pb" id="pBody">
          <div id="pContent"></div>
          <div class="trade-host" id="tradeHost" hidden></div>
          <div class="arch-host" id="archHost" hidden><iframe id="archFrame" title="건축 설계"></iframe></div>
        </div>
      </aside>
    </div>
  </main>
</div>

<dialog class="sheet" id="sheet">
  <div class="sheet-in">
    <nav class="sheet-nav" id="sheetNav">
      <h2>설정</h2>
      <button data-tab="brain">AI 두뇌</button>
      <button data-tab="local">내 기기 모델</button>
      <button data-tab="know">내 지식</button>
      <button data-tab="instr">맞춤 지침</button>
      <button data-tab="about">사용 현황</button>
    </nav>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <button class="ib sheet-x" id="sheetClose" aria-label="닫기"><svg class="i"><use href="#i-x"/></svg></button>
</dialog>
<div class="toast" id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
