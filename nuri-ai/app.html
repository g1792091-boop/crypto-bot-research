<title>누리 AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: conversation rail left, single reading column center (max 760px), composer docked at bottom; drawer rail on phones */
:root{
  --bg:#F4F5F3; --panel:#FFFFFF; --panel-2:#ECEEEB; --line:#D9DDD8; --ink:#171A1C; --muted:#606A66;
  --accent:#0E7A63; --accent-soft:#DCEFE9; --accent-ink:#FFFFFF; --user:#1E2427; --user-ink:#F3F5F4;
  --ok:#2F7D4B; --warn:#A8691A; --bad:#B53A2F; --code-bg:#1B1F22; --code-ink:#E3E7E5;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101315; --panel:#171B1D; --panel-2:#1F2427; --line:#2E3538; --ink:#E6EAE8; --muted:#97A29D;
  --accent:#3FC4A2; --accent-soft:#16332C; --accent-ink:#0B1412; --user:#2A3236; --user-ink:#EEF2F0;
  --ok:#5DBE80; --warn:#E0A64E; --bad:#E57B6E; --code-bg:#0B0D0F; --code-ink:#DCE2DF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101315; --panel:#171B1D; --panel-2:#1F2427; --line:#2E3538; --ink:#E6EAE8; --muted:#97A29D;
  --accent:#3FC4A2; --accent-soft:#16332C; --accent-ink:#0B1412; --user:#2A3236; --user-ink:#EEF2F0;
  --ok:#5DBE80; --warn:#E0A64E; --bad:#E57B6E; --code-bg:#0B0D0F; --code-ink:#DCE2DF; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%}
/* rail */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail-top{padding:16px 14px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em}
.newchat{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:9px;font-weight:500}
.newchat:hover{border-color:var(--accent)}
.search{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:7px 10px;font-size:13px}
.chatlist{flex:1;overflow:auto;padding:4px 8px 8px;display:flex;flex-direction:column;gap:2px;min-height:0}
.grp{font-size:11px;color:var(--muted);letter-spacing:.06em;padding:10px 8px 4px}
.ci{display:flex;align-items:center;gap:6px;border-radius:6px;padding:7px 8px;cursor:pointer;color:var(--ink);border:0;background:transparent;text-align:left;width:100%}
.ci:hover{background:var(--panel-2)}
.ci[aria-current="true"]{background:var(--accent-soft)}
.ci span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.ci .del{opacity:0;border:0;background:transparent;color:var(--muted);padding:0 4px;font-size:12px}
.ci:hover .del,.ci:focus-within .del{opacity:1}
.rail-nav{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px}
.rail-nav button{display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;border-radius:6px;padding:8px 10px;color:var(--muted);font-weight:500;text-align:left}
.rail-nav button:hover{background:var(--panel-2);color:var(--ink)}
.rail-nav button[aria-current="page"]{color:var(--ink);background:var(--panel-2)}
.store-pill{font-size:11px;color:var(--muted);padding:6px 10px}

/* main */
main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 9px}
.topbar h1{font-size:15px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px;font-size:13px;max-width:220px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

.view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;min-height:0}
.col{max-width:780px;margin:0 auto;padding-block:20px 28px;padding-inline:20px;display:flex;flex-direction:column;gap:22px}

/* messages */
.m{display:flex;flex-direction:column;gap:6px;min-width:0}
.m.user{align-items:flex-end}
.m.user .bubble{background:var(--user);color:var(--user-ink);border-radius:14px 14px 4px 14px;padding:9px 14px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.m.ai .who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.avatar{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px;font-weight:800}
.md{min-width:0;word-break:break-word}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:.55em 0}
.md h1,.md h2,.md h3,.md h4{margin:1em 0 .4em;line-height:1.35;text-wrap:balance}
.md h1{font-size:1.3em}.md h2{font-size:1.18em}.md h3{font-size:1.06em}
.md ul,.md ol{padding-left:1.4em;margin:.5em 0}
.md li{margin:.2em 0}
.md blockquote{margin:.6em 0;padding:.2em .9em;border-left:3px solid var(--line);color:var(--muted)}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--panel-2);padding:.1em .35em;border-radius:4px}
.md a{color:var(--accent)}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.md .tbl{overflow-x:auto;margin:.6em 0}
.md table{border-collapse:collapse;font-size:.93em;min-width:60%}
.md th,.md td{border:1px solid var(--line);padding:5px 10px;text-align:left}
.md th{background:var(--panel-2)}
.codebox{margin:.7em 0;border-radius:8px;overflow:hidden;background:var(--code-bg)}
.codebox .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:11.5px;color:#9AA6A1;font-family:var(--f-mono);border-bottom:1px solid #2A3033}
.codebox .bar button{border:0;background:transparent;color:#C6D0CC;font-size:11.5px}
.codebox pre{margin:0;padding:12px;overflow:auto;color:var(--code-ink);font-family:var(--f-mono);font-size:13px;line-height:1.55}
.codebox pre code{background:transparent;padding:0;color:inherit;font-size:inherit}
details.think{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted);background:var(--panel)}
details.think summary{cursor:pointer}
details.think div{white-space:pre-wrap;margin-top:6px;max-height:260px;overflow:auto}
.tools{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tools button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:4px}
.tools button:hover{background:var(--panel-2);color:var(--ink)}
.tools .meta{font-size:11.5px;color:var(--muted);margin-left:4px}
.err{border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent);border-radius:8px;padding:8px 12px;font-size:13.5px}
.files{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fchip{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted);background:var(--panel);display:inline-flex;gap:6px;align-items:center}
.fchip button{border:0;background:transparent;color:var(--muted);padding:0}
.cursor::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* empty */
.hello{display:flex;flex-direction:column;gap:18px;padding-top:6vh}
.hello h2{font-size:26px;margin:0;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.hello p{margin:0;color:var(--muted)}
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.starter{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 14px;text-align:left;font-size:14px}
.starter:hover{border-color:var(--accent)}
.notice{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.notice b{color:var(--ink)}

/* composer */
.composer{border-top:1px solid var(--line);background:var(--bg);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.cbox{max-width:780px;margin:0 auto;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.cbox:focus-within{border-color:var(--accent)}
.cbox textarea{border:0;background:transparent;resize:none;outline:none;min-height:44px;max-height:220px;padding:4px 6px;width:100%}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crow .sp{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--ink)}
.send{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px 16px;font-weight:700}
.send:disabled{opacity:.45;cursor:default}
.send.stop{background:var(--ink);color:var(--bg)}
.hint{max-width:780px;margin:6px auto 0;font-size:11.5px;color:var(--muted);text-align:center}

/* panels (dashboard, bots, settings) */
.page{max-width:1080px;margin:0 auto;padding-block:22px 40px;padding-inline:20px;display:flex;flex-direction:column;gap:18px}
.page h2{font-size:20px;margin:0;letter-spacing:-.01em}
.page .sub{color:var(--muted);margin:2px 0 0;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi label{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:500}
.kpi .s{font-size:11.5px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.card h3{font-size:14px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.card .body{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}
.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:13px}
.hbar .track{height:10px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:0 3px 3px 0}
.hbar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .num{text-align:right;color:var(--muted)}
.recent{display:flex;flex-direction:column}
.recent button{display:flex;justify-content:space-between;gap:10px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 2px;text-align:left}
.recent button:last-child{border-bottom:0}
.recent button span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.recent .num{color:var(--muted);font-size:12px;white-space:nowrap}
.empty{color:var(--muted);font-size:13.5px}

.bots{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.bot{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.bot .hd{display:flex;align-items:center;gap:10px}
.bot .ini{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800}
.bot b{font-size:15px}
.bot p{margin:0;font-size:13px;color:var(--muted);flex:1}
.bot .row{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 12px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.form .wide{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;color:var(--ink);font-size:14px;width:100%}
.form textarea{resize:vertical;min-height:90px}
.engines{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.eng{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.eng.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.eng .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eng b{font-size:15px}
.eng p{margin:0;font-size:13px;color:var(--muted)}
.progress{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.small{font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.scrim{display:none}

@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;transform:translateX(-102%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .app.open .rail{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
  .menu-btn{display:inline-block}
  .form{grid-template-columns:1fr}
  .col,.page{padding-inline:16px}
  .composer{padding-inline:12px}
  .topbar h1{flex:1 1 calc(100% - 56px)}
  .sel{max-width:none;flex:1 1 0;min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <aside class="rail" aria-label="대화 목록">
    <div class="rail-top">
      <div class="brand"><span class="logo">누</span><div><b>누리 AI</b><small>나만의 AI 챗봇</small></div></div>
      <button class="newchat" id="newChat">+ 새 대화</button>
      <input class="search" id="search" type="search" placeholder="대화 검색" aria-label="대화 검색">
    </div>
    <div class="chatlist" id="chatList"></div>
    <nav class="rail-nav" aria-label="메뉴">
      <button data-go="chat" aria-current="page">채팅</button>
      <button data-go="dash">대시보드</button>
      <button data-go="bots">내 봇 만들기</button>
      <button data-go="settings">AI 엔진 설정 <span class="dot" id="engDot"></span></button>
      <span class="store-pill" id="storePill">이 브라우저에 저장</span>
    </nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main>
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">☰</button>
      <h1 id="title">새 대화</h1>
      <select class="sel" id="botSel" aria-label="봇 선택"></select>
      <select class="sel" id="engSel" aria-label="AI 엔진 선택"></select>
      <span class="pill" id="engPill"><i class="dot"></i><span>확인 중</span></span>
    </header>

    <section class="view" id="v-chat">
      <div class="scroll" id="scroll"><div class="col" id="msgs"></div></div>
      <div class="composer">
        <div class="cbox">
          <div class="files" id="pending" style="justify-content:flex-start"></div>
          <textarea id="input" rows="1" placeholder="무엇이든 물어보세요" aria-label="메시지 입력"></textarea>
          <div class="crow">
            <label class="icon-btn" for="fileIn" id="attachBtn">파일 첨부</label>
            <input type="file" id="fileIn" multiple hidden>
            <span class="small" id="modelNote"></span>
            <span class="sp"></span>
            <button class="send" id="send" disabled>보내기</button>
          </div>
        </div>
        <div class="hint">Enter 보내기 · Shift+Enter 줄바꿈 · AI는 틀릴 수 있으니 중요한 정보는 확인하세요.</div>
      </div>
    </section>

    <section class="view" id="v-dash" hidden><div class="scroll"><div class="page" id="dash"></div></div></section>
    <section class="view" id="v-bots" hidden><div class="scroll"><div class="page" id="botsPage"></div></div></section>
    <section class="view" id="v-settings" hidden><div class="scroll"><div class="page" id="setPage"></div></div></section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const IN_ARTIFACT = !!(window.claude && window.claude.use);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ls = {
  get(k, d){ try{ const v = localStorage.getItem("nuri:"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("nuri:"+k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const toast = m => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); };
const fmtN = n => Number(n).toLocaleString("ko-KR");

/* ================= 봇(페르소나) ================= */

  coll:null, pending:new Map(), chain:new Map(),

    try {

      if (!db || !user) return;

      this.coll = db.collection("data/users/" + id);

      let changed = false;
      const seen = new Set();
      for (const d of snap.docs){
        const body = d.data(); if (!body) continue;

          else if (body.chat.updated > loc.updated){ Object.assign(loc, structuredClone(body.chat)); changed = true; }
          else if (loc.updated > body.chat.updated) this.save(loc);

          customBots = structuredClone(body.bots); ls.set("bots", customBots); ls.set("botsUpdated", body.updated); changed = true;
        } else if (body.kind === "deleted" && Array.isArray(body.ids)){
          const before = chats.length; chats = chats.filter(c => !body.ids.includes(c.id)); if (chats.length !== before) changed = true;

function inline(s){
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length-1) + "\u0000"; });
  s = esc(s);
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>").replace(/__([^_\n]+)__/g, "<strong>$1</strong>")
       .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>").replace(/~~([^~\n]+)~~/g, "<del>$1</del>")
       .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[+i]) + "</code>");
}
function md(src){
  const lines = String(src).replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  while (i < lines.length){
    const l = lines[i];
    const fence = l.match(/^\s*(```|~~~)\s*([\w+#.-]*)/);
    if (fence){
      const buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence[1])) buf.push(lines[i++]);
      i++;
      out.push(`<div class="codebox"><div class="bar"><span>${esc(fence[2] || "code")}</span><button data-copy>복사</button></div><pre><code>${esc(buf.join("\n"))}</code></pre></div>`);
      continue;
    }
    if (/^\s*$/.test(l)){ i++; continue; }
    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if (h){ const n = Math.min(4, h[1].length); out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if (l.includes("|") && i+1 < lines.length && isTableSep(lines[i+1])){
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push(`<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^\s*>/.test(l)){ const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, "")); out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`); continue; }
    const li = l.match(/^(\s*)([-*+]|\d+[.)])\s+/);
    if (li){
      const ordered = /\d/.test(li[2]), items = [];
      while (i < lines.length){
        const m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (m && m[1].length <= li[1].length + 1){ items.push([m[3]]); i++; continue; }
        if (items.length && /^\s{2,}\S/.test(lines[i])){ items[items.length-1].push(lines[i].trim()); i++; continue; }
        break;
      }
      out.push(`<${ordered?"ol":"ul"}>${items.map(it => `<li>${it.length > 1 && /^([-*+]|\d+[.)])\s/.test(it[1]) ? inline(it[0]) + md(it.slice(1).join("\n")) : inline(it.join(" "))}</li>`).join("")}</${ordered?"ol":"ul"}>`);
      continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*```|\s*~~~|\s*>|\s*([-*+]|\d+[.)])\s)/.test(lines[i]) && !(lines[i].includes("|") && i+1 < lines.length && isTableSep(lines[i+1]))) buf.push(lines[i++]);
    if (!buf.length){ buf.push(lines[i++]); }
    out.push(`<p>${buf.map(inline).join("<br>")}</p>`);
  }
  return out.join("");
}
function splitThink(text){
  const t = String(text || "");
  const s = t.indexOf("<think>");
  if (s === -1) return {think:"", body:t};
  const e = t.indexOf("</think>", s);
  if (e === -1) return {think:t.slice(s+7), body:t.slice(0, s), open:true};
  return {think:t.slice(s+7, e).trim(), body:(t.slice(0, s) + t.slice(e+8)).trim()};
}

  const groups = [["오늘", c => c.updated >= +now], ["지난 7일", c => c.updated >= +now - 6*day], ["이전", () => true]];
  const used = new Set(); let html = "";
  for (const [label, fn] of groups){
    const g = list.filter(c => !used.has(c.id) && fn(c)); if (!g.length) continue;
    g.forEach(c => used.add(c.id));
    html += `<div class="grp">${label}</div>` + g.map(c => `<div class="ci" role="button" tabindex="0" data-id="${c.id}" aria-current="${current && current.id===c.id}"><span>${esc(c.title)}</span><button class="del" data-del="${c.id}" aria-label="대화 삭제">삭제</button></div>`).join("");

}

  }
  const {think, body, open} = splitThink(m.content);
  const thinkAll = (m.think || "") + (think ? (m.think ? "\n" : "") + think : "");
  const eng = ENGINES[m.engine];
  return `<div class="m ai" data-i="${i}"><div class="who"><span class="avatar">누</span><span>${esc(botById(current.botId).name)}${eng ? " · " + esc(eng.short) : ""}</span></div>

    <div class="md${m.streaming ? " cursor" : ""}">${body ? md(body) : (m.streaming && !thinkAll ? '<p style="color:var(--muted)">' + (m.waiting || "답변을 준비하는 중…") + "</p>" : "")}</div>
    ${m.error ? `<div class="err">${esc(m.error)}</div>` : ""}
    ${m.streaming ? "" : `<div class="tools"><button data-act="copy">복사</button><button data-act="regen">다시 생성</button><span class="meta">${m.ms ? (m.ms/1000).toFixed(1) + "초" : ""}${m.model ? " · " + esc(shortModel(m.model)) : ""}</span></div>`}</div>`;

let busy = false, ctl = null;
function activeEngine(){ return $("#engSel").value || pickEngine(); }
function send(){
  const text = input.value.trim(); if (!text && !attach.length && !images.length) return;
  const eng = activeEngine();
  if (!engineStatus(eng).ok){ toast(ENGINES[eng].label + ": " + engineStatus(eng).text); go("settings"); return; }
  if (!chats.includes(current)) chats.push(current);
  current.messages.push({role:"user", content: text || "첨부한 파일을 살펴봐줘", attach: attach.length ? attach : undefined, images: images.length ? images.map(f => f.name) : undefined, ts: Date.now()});
  if (current.title === "새 대화") current.title = (text || attach[0]?.name || "이미지 질문").replace(/\s+/g, " ").slice(0, 32);

  input.value = ""; attach = []; images = []; renderPending(); autoGrow();
  saveChat(current); renderList(); $("#title").textContent = current.title;
  run(imgs);

function stop(){ ctl?.abort(); if (local.engine && local.generating) try { local.engine.interruptGenerate(); } catch(e){} }

function buildTurns(){
  // 긴 대화는 최근 내용만 보냄 (약 12만 자)
  const msgs = [];
  let budget = 120000;
  for (let i = current.messages.length - 1; i >= 0; i--){
    const m = current.messages[i];
    let c = m.role === "assistant" ? splitThink(m.content).body : m.content;
    if (m.attach) c += m.attach.map(a => `\n\n[첨부 파일: ${a.name}]\n\`\`\`\n${a.text.slice(0, 60000)}\n\`\`\``).join("");
    if (!c) continue;
    budget -= c.length; if (budget < 0 && msgs.length) break;
    msgs.unshift({role: m.role === "assistant" ? "assistant" : "user", content: c});
  }
  while (msgs.length && msgs[0].role !== "user") msgs.shift();
  // 같은 역할이 연속되면 하나로 합침 (오류로 답이 빠진 경우)
  return msgs.reduce((acc, m) => { const last = acc[acc.length-1]; if (last && last.role === m.role) last.content += "\n\n" + m.content; else acc.push({...m}); return acc; }, []);
}
function systemPrompt(){
  const bot = botById(current.botId);
  const d = new Date();
  return `${bot.system}\n\n${BASE_RULES}\n오늘 날짜: ${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일.`;
}
async function run(imgs){
  const eng = activeEngine(), model = modelOf(eng);
  const out = {role:"assistant", content:"", engine: eng, model: eng === "claude" ? "Claude " + ENGINES.claude.models.find(x => x[0]===model)?.[1] : model, ts: Date.now(), streaming: true};
  current.messages.push(out);
  const idx = current.messages.length - 1;
  busy = true; updateSend(); renderChat(); scrollDown(true);
  ctl = new AbortController();
  const t0 = performance.now();
  let raf = 0;
  const paint = () => { raf = 0; const el = $(`#msgs .m[data-i="${idx}"]`); if (el){ el.outerHTML = msgHTML(out, idx); scrollDown(); } };
  const onText = text => { out.content = text; if (!raf) raf = requestAnimationFrame(paint); };
  const onThink = t => { out.think = t; if (!raf) raf = requestAnimationFrame(paint); };
  try {
    const turns = buildTurns();
    await ENGINE_RUN[eng]({turns, system: systemPrompt(), model, onText, onThink, signal: ctl.signal, images: imgs, temp: botById(current.botId).temp ?? settings.temp});
    if (!out.content.trim() && !out.think) out.error = "빈 답변이 돌아왔습니다. 다시 생성해 보세요.";
  } catch (e){
    if (e && (e.name === "AbortError" || e.code === "cancelled")) { if (!out.content) out.error = "답변을 멈췄습니다."; }
    else out.error = friendlyError(eng, e);
    if (e && e.text && !out.content) out.content = e.text;
  } finally {
    cancelAnimationFrame(raf);
    out.streaming = false; out.ms = Math.round(performance.now() - t0);
    busy = false; ctl = null; local.generating = false;
    saveChat(current); renderList(); updateSend(); paint(); scrollDown();
  }
}
function friendlyError(eng, e){
  const code = e && (e.code || e.status);
  if (eng === "claude"){
    return ({not_granted:"Claude 사용이 허용되지 않았습니다. 다시 보내면 허용 창이 다시 뜹니다.", rate_limited:"요청이 몰려 잠시 쉬어야 합니다. 1분쯤 뒤에 다시 보내세요.", prompt_too_large:"대화나 첨부가 너무 깁니다. 새 대화를 시작하거나 첨부를 줄이세요."})[code] || "Claude 응답을 받지 못했습니다" + (e && e.message ? ": " + e.message : ".");
  }
  if (code === 401 || code === 403) return "API 키가 올바르지 않거나 권한이 없습니다. 설정에서 키를 확인하세요.";
  if (code === 404) return "모델 이름을 찾을 수 없습니다. 설정에서 '모델 목록 불러오기'로 이름을 고르세요.";
  if (code === 429) return "사용 한도나 요청 속도 제한에 걸렸습니다. 잠시 뒤 다시 시도하거나 요금제를 확인하세요.";
  if (e instanceof TypeError) return "서버에 연결하지 못했습니다. 인터넷 연결, 서버 주소, 브라우저 접근(CORS) 허용 여부를 확인하세요.";
  return (e && e.message) || "알 수 없는 오류가 났습니다.";
}

/* ---------- 엔진별 호출 ---------- */
async function* sse(res){
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;){
    const {value, done} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream:true});
    let n;
    while ((n = buf.indexOf("\n")) >= 0){
      const line = buf.slice(0, n).replace(/\r$/, ""); buf = buf.slice(n+1);
      if (line.startsWith("data:")){ const d = line.slice(5).trim(); if (d && d !== "[DONE]") { try { yield JSON.parse(d); } catch(e){} } }
    }
  }
}
async function httpFail(res){
  let msg = ""; try { const j = await res.json(); msg = j.error?.message || j.message || JSON.stringify(j).slice(0, 200); } catch(e){}
  const err = new Error(`${res.status} ${msg}`); err.status = res.status; throw err;
}
const ENGINE_RUN = {
  async claude({turns, system, model, onText, signal, images}){
    const input = [{role:"user", content: "[대화 지침]\n" + system + "\n\n이 지침에 따라 아래 대화를 이어가라."}, ...turns];
    const opts = {onText: ({text}) => onText(text), signal, modelTier: model, cache: false};
    if (images && images.length) opts.images = images;
    const r = await sample(input, opts);
    onText(r.text + (r.truncated ? "\n\n*(답변이 길어 중간에 끊겼습니다. '계속'이라고 보내면 이어서 씁니다.)*" : ""));
  },
  async local({turns, system, onText, onThink, signal, temp}){
    if (!local.engine) throw new Error("자체 엔진 모델을 먼저 불러오세요.");
    local.generating = true;
    const stream = await local.engine.chat.completions.create({messages:[{role:"system", content:system}, ...turns], stream:true, temperature: temp});
    let text = "";
    for await (const ch of stream){
      if (signal.aborted){ try { local.engine.interruptGenerate(); } catch(e){} break; }
      const d = ch.choices?.[0]?.delta?.content; if (d){ text += d; onText(text); }
    }
  },
  async openai(a){ return openaiCompat("openai", a); },
  async deepseek(a){ return openaiCompat("deepseek", a); },
  async custom(a){ return openaiCompat("custom", a); },
  async anthropic({turns, system, model, onText, signal}){
    const res = await fetch("https://api.anthropic.com/v1/messages", {method:"POST", signal, headers:{"content-type":"application/json", "x-api-key": keys.anthropic, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({model, max_tokens: 16000, system, messages: turns, stream: true})});
    if (!res.ok) await httpFail(res);
    let text = "";
    for await (const ev of sse(res)){
      if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta"){ text += ev.delta.text; onText(text); }
      if (ev.type === "message_delta" && ev.delta?.stop_reason === "refusal"){ text += "\n\n*(안전 정책에 따라 이 요청에는 답하지 않았습니다.)*"; onText(text); }
      if (ev.type === "message_delta" && ev.delta?.stop_reason === "max_tokens"){ text += "\n\n*(길이 제한으로 끊겼습니다. '계속'이라고 보내세요.)*"; onText(text); }
      if (ev.type === "error") throw new Error(ev.error?.message || "Anthropic 오류");
    }
  },
  async gemini({turns, system, model, onText, onThink, signal, temp}){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`;
    const res = await fetch(url, {method:"POST", signal, headers:{"content-type":"application/json", "x-goog-api-key": keys.gemini},
      body: JSON.stringify({systemInstruction:{parts:[{text:system}]}, contents: turns.map(t => ({role: t.role === "assistant" ? "model" : "user", parts:[{text:t.content}]})), generationConfig:{temperature: temp}})});
    if (!res.ok) await httpFail(res);
    let text = "", think = "";
    for await (const ev of sse(res)){
      for (const p of ev.candidates?.[0]?.content?.parts || []){ if (!p.text) continue; if (p.thought){ think += p.text; onThink(think); } else { text += p.text; onText(text); } }
      if (ev.error) throw new Error(ev.error.message);
    }
  }
};
async function openaiCompat(id, {turns, system, model, onText, onThink, signal, temp}){
  const headers = {"content-type":"application/json"}; if (keys[id]) headers.authorization = "Bearer " + keys[id];
  const body = {model, messages:[{role:"system", content:system}, ...turns], stream:true};
  if (!(id === "deepseek" && /reasoner/.test(model))) body.temperature = temp;
  const res = await fetch(baseOf(id).replace(/\/$/, "") + "/chat/completions", {method:"POST", signal, headers, body: JSON.stringify(body)});
  if (!res.ok) await httpFail(res);
  let text = "", think = "";
  for await (const ev of sse(res)){
    const d = ev.choices?.[0]?.delta || {};
    if (d.reasoning_content){ think += d.reasoning_content; onThink(think); }
    if (d.content){ text += d.content; onText(text); }
  }
}

/* ---------- 자체 엔진 (WebLLM) ---------- */
async function checkGpu(){
  if (IN_ARTIFACT){ gpuOk = false; return; }
  try { gpuOk = !!(navigator.gpu && await navigator.gpu.requestAdapter()); } catch(e){ gpuOk = false; }
  refreshEngineUI();
}
async function loadLocal(modelId){
  if (local.loading) return;
  local.loading = true; local.progress = 0; local.text = "라이브러리를 불러오는 중…"; refreshEngineUI();
  try {
    const webllm = await import("https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.85/+esm");
    if (local.engine){ try { await local.engine.unload(); } catch(e){} local.engine = null; }
    local.engine = await webllm.CreateMLCEngine(modelId, {initProgressCallback: p => { local.progress = p.progress || 0; local.text = p.text || ""; refreshEngineUI(); }});
    local.model = modelId; settings.models.local = modelId; settings.engine = "local"; saveSettings();
    toast("자체 엔진 준비 완료: " + shortModel(modelId));
  } catch (e){
    local.engine = null; local.text = "불러오지 못했습니다: " + (e && e.message ? e.message : e); toast("모델을 불러오지 못했습니다");
  } finally { local.loading = false; refreshEngineUI(); }
}

function renderDash(){
  const msgs = chats.flatMap(c => c.messages.map(m => ({...m, botId:c.botId})));
  const users = msgs.filter(m => m.role === "user"), ais = msgs.filter(m => m.role === "assistant" && !m.error);
  const today = new Date(); today.setHours(0,0,0,0);
  const todayN = users.filter(m => m.ts >= +today).length;
  const chars = msgs.reduce((a,m) => a + (m.content||"").length, 0);
  const avgMs = ais.filter(m => m.ms).reduce((a,m,_,arr) => a + m.ms/arr.length, 0);
  const days = [...Array(14)].map((_, i) => { const d = new Date(+today - (13-i)*864e5); return {d, n: users.filter(m => m.ts >= +d && m.ts < +d + 864e5).length}; });
  const engCount = {}; ais.forEach(m => engCount[m.engine] = (engCount[m.engine]||0) + 1);
  const botCount = {}; users.forEach(m => botCount[m.botId] = (botCount[m.botId]||0) + 1);
  const hb = (obj, labelFn) => { const e = Object.entries(obj).sort((a,b) => b[1]-a[1]); const mx = Math.max(1, ...e.map(x => x[1])); return e.length ? e.map(([k,v]) => `<div class="hbar"><span title="${esc(labelFn(k))}">${esc(labelFn(k))}</span><span class="track"><i style="width:${v/mx*100}%"></i></span><span class="num">${fmtN(v)}</span></div>`).join("") : `<p class="empty">아직 기록이 없습니다.</p>`; };
  $("#dash").innerHTML = `
    <div><h2>대시보드</h2><p class="sub">내 대화 기록으로 계산한 사용 현황입니다.</p></div>

      <div class="kpi"><label>보낸 질문</label><span class="v">${fmtN(users.length)}</span><span class="s">오늘 ${fmtN(todayN)}개</span></div>
      <div class="kpi"><label>받은 답변</label><span class="v">${fmtN(ais.length)}</span><span class="s">오류 제외</span></div>
      <div class="kpi"><label>평균 응답 시간</label><span class="v">${ais.length ? (avgMs/1000).toFixed(1) + "초" : "–"}</span><span class="s">답변 완료까지</span></div>
      <div class="kpi"><label>주고받은 글자</label><span class="v">${chars > 9999 ? fmtN(Math.round(chars/1000)) + "천" : fmtN(chars)}</span><span class="s">질문과 답변 합계</span></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>최근 14일 질문 수 <small>하루 단위</small></h3><div class="body"><div class="chart" id="dayChart"></div></div></div>
      <div class="card"><h3>엔진별 답변</h3><div class="body">${hb(engCount, k => ENGINES[k]?.short || k)}</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>최근 대화</h3><div class="body"><div class="recent">${byUpdated().slice(0,8).map(c => `<button data-open="${c.id}"><span>${esc(c.title)}</span><span class="num">${new Date(c.updated).toLocaleDateString("ko-KR",{month:"short",day:"numeric"})} · ${c.messages.length}개</span></button>`).join("") || `<p class="empty">첫 대화를 시작해 보세요.</p>`}</div></div></div>
      <div class="card"><h3>봇별 질문</h3><div class="body">${hb(botCount, k => botById(k).name)}</div></div>
    </div>`;
  drawBars($("#dayChart"), days);
}
function drawBars(el, days){
  const W = 560, H = 200, pl = 30, pr = 8, pt = 12, pb = 26;
  const mx = Math.max(...days.map(d => d.n));
  const step = mx <= 4 ? 1 : mx <= 10 ? 2 : mx <= 25 ? 5 : Math.ceil(mx/5/5)*5;
  const top = Math.max(step, Math.ceil(mx/step)*step);
  const y = v => pt + (H - pt - pb) * (1 - v/top), bw = (W - pl - pr) / days.length;
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"${v ? ' stroke-dasharray="2 3"' : ""}/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${v}</text>`;
  days.forEach((d, i) => {
    const x = pl + i*bw + 3, w = bw - 6, h = y(0) - y(d.n), last = i === days.length - 1;
    if (d.n) g += `<path d="M${x},${y(0)} v${-(h-3)} q0,-3 3,-3 h${w-6} q3,0 3,3 v${h-3} z" fill="var(--accent)" opacity="${last ? 1 : .72}"/>`;
    g += `<rect x="${pl + i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent" data-i="${i}"/>`;
    if (i % 2 === 1 || last) g += `<text x="${x + w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.d.getMonth()+1}/${d.d.getDate()}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 14일 하루 질문 수">${g}</svg><div class="tip" hidden></div>`;
  const tip = el.querySelector(".tip");
  el.querySelector("svg").addEventListener("pointermove", e => {
    const r = e.target.closest("rect[data-i]"); if (!r){ tip.hidden = true; return; }
    const d = days[+r.dataset.i], box = el.getBoundingClientRect(), rb = r.getBoundingClientRect();
    tip.hidden = false; tip.textContent = `${d.d.getMonth()+1}월 ${d.d.getDate()}일 · 질문 ${d.n}개`;
    tip.style.left = (rb.left - box.left + rb.width/2) + "px"; tip.style.top = (y(d.n)/H*box.height) + "px";
  });
  el.querySelector("svg").addEventListener("pointerleave", () => tip.hidden = true);
}

async function listModels(id, btn){
  btn.disabled = true; btn.textContent = "불러오는 중…";
  try {
    let names = [];
    if (id === "gemini"){
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", {headers:{"x-goog-api-key": keys.gemini || ""}}); if (!r.ok) await httpFail(r);
      names = (await r.json()).models.filter(m => (m.supportedGenerationMethods||[]).includes("generateContent")).map(m => m.name.replace(/^models\//, ""));
    } else if (id === "anthropic"){
      const r = await fetch("https://api.anthropic.com/v1/models?limit=100", {headers:{"x-api-key": keys.anthropic || "", "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"}}); if (!r.ok) await httpFail(r);
      names = (await r.json()).data.map(m => m.id);
    } else {
      const h = {}; if (keys[id]) h.authorization = "Bearer " + keys[id];
      const r = await fetch(baseOf(id).replace(/\/$/, "") + "/models", {headers:h}); if (!r.ok) await httpFail(r);
      names = (await r.json()).data.map(m => m.id).sort();
    }
    $("#dl-" + id).innerHTML = names.map(n => `<option value="${esc(n)}">`).join("");
    toast(`모델 ${names.length}개를 불러왔습니다. 모델 칸을 눌러 고르세요`);
  } catch (err){ toast(friendlyError(id, err)); }
  finally { btn.disabled = false; btn.textContent = "모델 목록 불러오기"; }
}
async function exportData(){

  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type:"application/json"})); a.download = filename; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);

async function importData(inp){
  const f = inp.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    let n = 0;
    for (const c of d.chats || []){ if (!c.id || !Array.isArray(c.messages)) continue; const i = chats.findIndex(x => x.id === c.id); if (i >= 0) chats[i] = c; else chats.push(c); cloud.save(c); n++; }
    for (const b of d.bots || []) if (b.id && b.name && !customBots.some(x => x.id === b.id)) customBots.push(b);
    persistLocal(); ls.set("bots", customBots); cloud.saveBots(); renderList(); renderBotSel(); renderSettings(); toast(`대화 ${n}개를 불러왔습니다`);
  } catch(e){ toast("누리 AI에서 내보낸 JSON 파일이 아닙니다"); }
  inp.value = "";
}
