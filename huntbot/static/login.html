<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>추세 사냥 로그인</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/hb.css">
<script src="/static/login.js" defer></script>
</head>
<body class="login">
<form class="lg-box" method="post" action="/login">
  <p class="badge">추세 사냥 · 모의</p>
  <h1>추세 사냥 모의 봇</h1>
  <p class="muted">종이 매매 (주문 없음) · 규칙봇·후보 리그와 다른 서버, 다른 대시보드입니다</p>
  <label for="pw">비밀번호</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required maxlength="1024" autofocus>
  <button type="submit">로그인</button>
  <p id="err" class="err" role="alert"></p>
</form>
</body>
</html>
