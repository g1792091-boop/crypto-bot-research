  const keep = {};
  main.querySelectorAll("[data-k]").forEach(el => { keep[el.dataset.k] = el.scrollLeft; });
  const opened = new Set([...main.querySelectorAll(".ft.open")].map(el => el.dataset.oid));
  let content;
  if (!lastMsg) content = empty("불러오는 중…", "대시보드 서버에 연결하고 있습니다");
  else if (S.meta && !S.meta.lastOk && tab !== "server") content = empty("아직 봇 자료를 받지 못했습니다", (S.meta.message || "") + " — 봇 창이 켜지고 30초쯤 지나면 나타납니다");
  else { try { content = R[tab](); } catch (e){ content = empty("화면을 그리는 중 오류", String(e && e.message || e)); console.error(e); } }
  main.replaceChildren(...[].concat(content).filter(Boolean));
  main.querySelectorAll("[data-k]").forEach(el => { if (keep[el.dataset.k]) el.scrollLeft = keep[el.dataset.k]; });
  main.querySelectorAll(".ft.clamp").forEach((el, i) => { el.dataset.oid = String(i); if (opened.has(String(i))){ el.classList.remove("clamp"); el.classList.add("open"); } });
  rendered = tab;
  tick();
}
function schedule(){ if (!raf) raf = requestAnimationFrame(render); }
function tick(){
  document.querySelectorAll("[data-ago]").forEach(el => { el.textContent = agoS(+el.dataset.ago); });
  document.querySelectorAll("[data-until]").forEach(el => { const r = +el.dataset.until - sNow(); el.textContent = r <= 0 ? "곧" : dur(r); });
}
document.getElementById("main").addEventListener("click", e => {
  const el = e.target.closest(".ft.clamp, .ft.open");
  if (!el || window.getSelection().toString()) return;
  el.classList.toggle("clamp"); el.classList.toggle("open");
});

/* ================= 탭 ================= */
const tabsEl = document.getElementById("tabs");
for (const [id, t] of TABS) tabsEl.append(h("button", {class: "tab" + (id === tab ? " on" : ""), "data-t": id, type: "button", on: {click: () => setTab(id)}}, t));
function setTab(id){
  tab = id; dirty.add("*");
  tabsEl.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === id));
  try { history.replaceState(null, "", "#" + id); } catch (e){}
  window.scrollTo(0, 0);
  schedule();
}
addEventListener("hashchange", () => { const id = location.hash.slice(1); if (TABS.some(t => t[0] === id) && id !== tab) setTab(id); });

/* ================= 자료 받기 (SSE, 안 되면 5초마다 /api/state) ================= */
function onData(d, full){
  if (!d || typeof d !== "object") return;
  if (full){ S = d; dirty.add("*"); }
  else { for (const k in d){ S[k] = d[k]; dirty.add(k); } }
  if (S.meta && isN(S.meta.now)) offset = S.meta.now - Date.now();
  lastMsg = Date.now(); serverDown = false;
  schedule();
}
let es = null, polling = false, lastPoll = 0;
function connect(){
  if (!("EventSource" in window)) return;
  try { if (es) es.close(); } catch (e){}
  es = new EventSource("/api/stream");
  es.addEventListener("full", ev => { try { onData(JSON.parse(ev.data), true); } catch (e){ console.error(e); } });
  es.addEventListener("patch", ev => { try { onData(JSON.parse(ev.data), false); } catch (e){ console.error(e); } });
  es.onerror = () => { if (es && es.readyState === 2) setTimeout(connect, 5000); };
}
async function poll(){
  if (polling) return; polling = true; lastPoll = Date.now();
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    onData(await r.json(), true);
  } catch (e){ serverDown = true; schedule(); }
  finally { polling = false; }
}
setInterval(() => {
  tick();
  if (Date.now() - lastMsg > 12000 && Date.now() - lastPoll >= 5000) poll();      // SSE 가 끊겼거나 막혔으면 5초마다 직접 받기
  if (lastMsg && Date.now() - lastMsg > 25000) serverDown = true;
  renderHeader();
}, 1000);
connect();
poll();
})();
</script>
