<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1320">
<meta name="referrer" content="no-referrer">
<title>GH Coin 로그인</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1320'/%3E%3Cpath d='M12 44 L26 30 L36 38 L52 18' stroke='%2322c55e' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0f1320;--card:#171e31;--line:#2e3a60;--text:#e8ebf4;--mut:#8e97ae;--up:#22c55e;--dn:#ef4444;--pri:#4f8cff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
form{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px;box-shadow:0 16px 40px rgba(0,0,0,.4)}
h1{margin:0 0 4px;font-size:22px;letter-spacing:.06em}
h1 i{font-style:normal;color:var(--up)}
p{margin:0 0 18px;color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px}
input:focus{outline:2px solid var(--pri);outline-offset:1px}
button{width:100%;margin-top:14px;padding:11px;border-radius:10px;border:0;background:var(--pri);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.err{margin:12px 0 0;color:#fecaca;font-size:13px}
.err:empty{display:none}
small{display:block;margin-top:16px;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<main>
<form method="post" action="/login" autocomplete="on">
  <h1>GH <i>COIN</i></h1>
  <p>봇 화면을 보고 조작하려면 비밀번호를 넣으세요.</p>
  <input type="hidden" name="next" value="{{NEXT}}">
  <label for="pw">대시보드 비밀번호</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus maxlength="256">
  <div class="err" role="alert">{{MSG}}</div>
  <button type="submit">들어가기</button>
  <small>비밀번호를 잊었으면 서버에서: <code>sudo cat /root/ghcoin-대시보드-비밀번호.txt</code></small>
</form>
</main>
</body>
</html>
