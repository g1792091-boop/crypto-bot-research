<!doctype html>
<!-- 개발용 확인 페이지 (tools/headless-run.mjs 가 연다). ?t=store|compare|chart|trader|review|mission  ·  &ai=1 이면 로컬 Ollama 사용  ·  &text=지시문 --><html lang="ko"><head><meta charset="utf-8"><title>RUN</title></head><body>
<script type="module">
const out = {}; const q = new URLSearchParams(location.search).get("t");
try {
  const ai = new URLSearchParams(location.search).get("ai") === "1";
  if (ai) localStorage.setItem("coinTeamLocal", "1");
  const O = await import("../gh-coin/coin-office.js");
  await O.loadLog();
  if (ai) { const m = await O.refreshOllama(); out.models = m; }
  if (q === "mission") {
    const text = new URLSearchParams(location.search).get("text") || "솔라나 1시간봉 추세추종 매매법 만들어줘";
    O.ask(text, {room: "dev"}).catch(() => {});
    const t0 = Date.now(); let M = null;
    while (Date.now() - t0 < 25 * 60e3) { await new Promise(r => setTimeout(r, 5000)); M = O.missions().slice(-1)[0]; document.title = "RUN " + (M ? M.attempts + "/" + M.plan.length + " " + M.status : "-"); if (M && M.status !== "doing") break; }
    for (let k = 0; k < 60; k++) { if ((await O.loadLog()).some(e => e.kind === "mission" && e.t >= t0)) break; await new Promise(r => setTimeout(r, 4000)); }   // 완성 보고서(요약 포함)가 올라올 때까지
    const log = await O.loadLog(), P = await import("../nuri-ai/paper.js"), book = await P.loadBook();
    out.mission = M && {status: M.status, attempts: M.attempts, plan: M.plan, log: M.log.map(x => x.job + ": " + x.text)};
    out.report = (log.filter(e => e.kind === "mission").slice(-1)[0]?.text || "").slice(0, 3500);
    out.notes = log.filter(e => e.kind === "system" && /🦴|🔧|🧪|📌/.test(e.text || "")).map(e => e.text.slice(0, 170));
    out.models_used = [...new Set(log.filter(e => e.kind === "agent" && e.model).map(e => e.model))];
    out.book = book.strategies.map(x => ({name: x.name, market: x.market, tf: x.tf, exp: !!x.exp, lev: x.spec?.risk?.leverage}));
  }
  if (q === "trader") {
    const pos = new URLSearchParams(location.search).get("pos");   // pos=win(이익 중인 롱) · pos=stop(손절선을 넘은 롱) → 차트에 그린 포지션 도구를 흉내 내 관리 판단을 시험
    if (pos) { const CR = await import("../nuri-ai/terminal/chartread.js"), px = (await CR.compare(["BTCUSDT"], "1h")).rows[0].last_price;
      const d = pos === "win" ? {e: px * 0.98, sl: px * 0.965, tp: px * 1.04} : {e: px * 1.03, sl: px * 1.01, tp: px * 1.08};
      localStorage.setItem("nuri:term:draw:binancef:BTCUSDT", JSON.stringify([{type: "long", pts: [{t: 1, p: d.e}, {t: 1, p: d.sl}, {t: 1, p: d.tp}, {t: 2, p: d.e}]}])); }
    const r = await O.traderDecision({sym: "BTCUSDT", interval: "1h"}); out.r = r; }
  if (q === "review") { const SK = await import("../gh-coin/lib/skeletons.js"); const v = SK.variant(7, "revert", "솔라나"); const r = await O.strategyReview({spec: {...v, symbol: "SOLUSDT", interval: "1h"}, market: "SOLUSDT", tf: "60"}); out.r = r && {name: r.name, trades: r.trades, pf: r.pf, score: r.score, rows: r.rows, text: r.text}; }
  if (q === "chart") { const r = await O.chartAnalyze({sym: "ETHUSDT", interval: "4h"}); out.r = {facts: r.facts, keys: Object.keys(r.json), text: r.text}; }
  if (q === "compare") { const r = await O.chartCompare({post: false}); out.r = r; }
  if (q === "store") { out.r = await O.storageProbe(); }
  if (q === "mkt") {   // 시장가 분석(토론 없이): 시간봉 추세 · 관망 규칙 · 스캘핑/타이밍 · 체크리스트 · 결론
    const N = await import("../gh-coin/neural.js"); N.load(); try { await N.step(); } catch (e) {}
    const r = await O.marketEntryNow({sym: new URLSearchParams(location.search).get("sym") || "BTCUSDT", debate: false});
    out.r = {decision: r.decision, extra: r.extra, checklist: r.checklist, best: {side: r.best.side, grade: r.best.grade, sl: r.best.sl, slPct: r.best.slPct, tp1: r.best.tp1, evidence: r.best.evidence}}; }
  if (q === "termmkt") {   // 차트 터미널을 열고 [⚡ 시장가] 패널을 실제로 그린다(토론 없이) → 스크린샷용
    const N = await import("../gh-coin/neural.js"); N.load(); try { await N.step(); } catch (e) {}
    window.ghCoinMarketEntry = (sym, onStep, opt = {}) => O.marketEntryNow({sym, by: "terminal", onStep, ...opt, debate: false});
    const T = await import("../nuri-ai/terminal/terminal.js"); await T.openTerminal({market: "BTCUSDT", interval: "15m"}); await new Promise(r => setTimeout(r, 4000));
    await T._term()._marketEntry(); await new Promise(r => setTimeout(r, 1500));
    const pn = document.querySelector(".nt-mkt"); if (pn) { pn.style.maxHeight = "none"; const sec = [...pn.querySelectorAll(".nt-mkt-sec")].find(x => x.textContent.includes("시간봉별")); sec?.scrollIntoView({block: "start"}); }
    document.title = "DONE"; await new Promise(r => setTimeout(r, 60e3)); }
  if (q === "click") {   // 뉴럴 데스크 버튼을 실제로 눌러 오류·설정 반영 확인 + 뉴트론 스냅샷·볼트 노트 생성
    const errs = []; addEventListener("error", e => errs.push(String(e.message))); addEventListener("unhandledrejection", e => errs.push(String(e.reason?.message || e.reason)));
    const U = await import("../gh-coin/neural-ui.js"); await U.openNeural(); await new Promise(r => setTimeout(r, 5000));
    const N = await import("../gh-coin/neural.js"), got = [];
    for (const [attr, val] of [["data-sty", "scalp"], ["data-tpm", "bal"], ["data-levm", "min"], ["data-sty", "scalp"], ["data-tpm", "ev"], ["data-levm", "fw"]]) {
      const b = document.querySelector(`[${attr}="${val}"]`); if (!b) { got.push(attr + "=" + val + " 버튼 없음"); continue; }
      b.click(); await new Promise(r => setTimeout(r, 400)); const c = N.cfg(); const on = document.querySelector(`[${attr}="${val}"]`)?.classList.contains("on");
      got.push(`${attr}=${val} → 스타일 ${JSON.stringify(c.styles)} · ${c.tpMode}/${c.levMode} · 화면 ✓ ${on}`); }
    out.score = N.state().score; document.querySelector("[data-bk]")?.click(); await new Promise(r => setTimeout(r, 800)); out.bk = document.querySelector(".nd-bk")?.innerText?.slice(0, 200);
    out.clicks = got; out.feed = N.state().feed.slice(0, 6).map(f => f.text);
    const NT = await import("../gh-coin/neutron.js"), snap = await NT.snapshot(), notes = NT.vaultNotes(snap);
    out.neutron = {hold: !!snap.neural?.hold, mood: !!snap.neural?.mood, notes: Object.keys(notes).length, holdNote: (notes["뇌/관망 규칙·감정·조정 채점.md"] || "").slice(0, 300)};
    out.errs = errs; }
  if (q === "aiauto") {   // 🤖 AI 자율 진입: 로컬 모델이 시장을 읽고(스캔) 조건이 맞으면 직접 데모 진입하는지
    const N = await import("../gh-coin/neural.js"), S = N.load(); for (const k of Object.keys(S.pos)) delete S.pos[k]; S.queue = [];
    await N.step(); const log = [];
    for (let k = 0; k < 6; k++) { await N.modelStep(); const a = N.state().aiAuto; log.push(JSON.stringify(a.last)); document.title = "RUN " + k; await new Promise(r => setTimeout(r, 31000)); }
    out.log = log; out.aiAuto = N.state().aiAuto; out.open = Object.values(S.pos).map(p => `${p.ko} ${p.side > 0 ? "롱" : "숏"} ${p.trader} ${p.name} sl ${p.sl} tp ${p.tp}`);
    out.feed = S.feed.slice(0, 12).map(f => f.text.slice(0, 150)); }
  if (q === "aiauto2") {   // 조건을 맞춘 가짜 읽기(4시간 추세 방향 · 확신 80%)로 AI 자율 진입 경로가 실제로 포지션을 여는지
    const N = await import("../gh-coin/neural.js"), S = N.load(); for (const k of Object.keys(S.pos)) delete S.pos[k]; S.queue = []; S.halt = 0; S.panic = 0; S.trades = S.trades.filter(t => t.R >= 0); await N.step();
    const sym = Object.keys(S.regime).find(k => S.regime[k].htf) || "BTCUSDT", rg = S.regime[sym], ko = sym.replace("USDT", ""), model = "qwen2.5:3b";
    out.try = { sym, htf: rg.htf, ok: N.aiAutoTry({ name: model, ko, sym, bias: rg.htf || 1, conf: 80, note: "시험 읽기", price: S.dec[sym].price, rg }) };
    out.last = N.state().aiAuto.last; out.open = Object.values(S.pos).map(p => `${p.ko} ${p.side > 0 ? "롱" : "숏"} ${p.lev}x 진입자=${p.trader} ${p.name} 리스크 ${p.riskPct}% sl ${p.sl} tp ${p.tp}`); out.feed = S.feed.slice(0, 4).map(f => f.text.slice(0, 200)); }
  if (q === "ui") {   // 뉴럴 데스크 화면을 띄우고 &find=글자 가 있는 줄로 스크롤 → 스크린샷용
    const U = await import("../gh-coin/neural-ui.js"); await U.openNeural(); await new Promise(r => setTimeout(r, 9000));
    const f = new URLSearchParams(location.search).get("find"); if (f) { const el = [...document.querySelectorAll(".nsub")].find(e => e.textContent.includes(f)); el?.scrollIntoView({ block: "start" }); out.found = !!el; }
    await new Promise(r => setTimeout(r, 800)); document.title = "DONE"; await new Promise(r => setTimeout(r, 60e3)); }
  if (q === "neural") {   // 뉴럴 데스크: 공포탐욕 · 자체 백테스트 + 관망 규칙집 진화 · 감정 · 가짜 포지션으로 익절 풀기(추적)·청산·조정 채점 · (&ai=1) AI 포지션 관리
    const N = await import("../gh-coin/neural.js"), S = N.load(); out.fng = await N.fngCheck(true);
    await N.step(); const sym = "SOLUSDT", px = S.dec[sym]?.price; out.px = px;
    if (px) { S.pos[sym] = {sym, ko: "SOL", side: 1, entry: px * 0.985, price: px, sl: px * 0.985 * 1.0008, tp: px * 1.02, liq: px * 0.94, lev: 20, margin: 25, notional: 500, risk: 5, riskPct: 0.5, rr: 2, slPct: 1, tpPct: 2, rDist: px * 0.985 * 0.01, be: true, beAt: Date.now() - 20 * 60e3, roe: 0, proe: 0, seed: 2.5, vkey: "ema_pullback@60", name: "테스트 포지션", cat: "추세", tf: "60", why: "harness", regime: "", trader: "자체 엔진", t: Date.now() - 3 * 3600e3, deadline: Date.now() + 40 * 3600e3, feat: {}, bReg: "" }; }
    if (new URLSearchParams(location.search).get("ai") === "1") { await N.modelStep(); out.review2 = S.review2; out.lv = S.pos[sym]?.lv; out.mtf = N.mtfText(sym); }
    await N.step(); out.afterRun = S.pos[sym] && {run: S.pos[sym].run, tp: S.pos[sym].tp, sl: S.pos[sym].sl, keep: S.pos[sym].keep, adj: (S.pos[sym].adj || []).map(a => a.kind + "/" + a.by), deadlineH: Math.round((S.pos[sym].deadline - Date.now()) / 3600e3)};
    if (S.pos[sym]) { S.pos[sym].sl = px * 1.01; S.pos[sym].chk = 0; } await N.step();   // 손절선을 현재가 위로 → 다음 스텝에서 청산 → 조정 채점 대기열
    out.closed = !S.pos[sym]; out.adjQ = (S.adjQ || []).length; await N.scoreAdj(true); out.adj = N.adjState();
    if (new URLSearchParams(location.search).get("cal") !== "0") { await N.calibrate(); for (let k = 0; k < 120 && N.state().calibrating; k++) { document.title = "RUN 백테스트 " + k * 5 + "초"; await new Promise(r => setTimeout(r, 5000)); } }
    out.hold = N.holdState(); out.mood = N.mood(); out.feed = S.feed.slice(0, 30).map(f => f.text.slice(0, 200)); }
} catch (e) { out.err = String(e?.stack || e).slice(0, 1500); }
document.body.innerText = JSON.stringify(out); document.title = "DONE";
</script></body></html>
