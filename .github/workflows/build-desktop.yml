name: Build desktop app

# Windows(.exe) / macOS 실행 파일을 빌드해서 'desktop-latest' 릴리스에 올린다.
# 사용자는 파이썬 없이 릴리스 페이지에서 zip 을 받아 더블클릭으로 실행한다.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

env:
  # Windows 러너 콘솔 기본 인코딩(cp1252)에서 한글 출력이 깨지지 않게
  PYTHONUTF8: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r backend/requirements.txt -r packaging/requirements-desktop.txt

      - name: Test
        working-directory: backend
        run: python -m pytest -q

      - name: Build
        run: python packaging/build.py

      - name: Smoke test (start app, call API)
        shell: bash
        env:
          NO_BROWSER: "1"
          DATA_SOURCE: synthetic
        run: |
          dir=$(ls -d dist/GHQuant-*/)
          exe="${dir}GHQuant"
          [ -f "${exe}.exe" ] && exe="${exe}.exe"
          [ -d "${dir}GHQuant.app" ] && exe="${dir}GHQuant.app/Contents/MacOS/GHQuant"
          "$exe" > smoke.log 2>&1 &
          pid=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/status > /dev/null; then ok=1; break; fi
            sleep 2
          done
          cat smoke.log
          curl -sf http://127.0.0.1:8000/ > /dev/null
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //IM GHQuant.exe //F || true; else kill $pid || true; fi
          [ -n "$ok" ] || { echo "app did not start"; exit 1; }
          [ -f "${dir}state/GHQuant.log" ] && cat "${dir}state/GHQuant.log"
          rm -rf "${dir}state"

      - name: App window check (Windows · WebView2 PC app window, no browser)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DATA_SOURCE: synthetic
        run: |
          $d = Get-ChildItem dist -Directory -Filter "GHQuant-*" | Select-Object -First 1
          $p = Start-Process -FilePath (Join-Path $d.FullName "GHQuant.exe") -PassThru
          $title = ""
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            $title = (Get-Process -Id $p.Id -ErrorAction SilentlyContinue).MainWindowTitle
            $wv = Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" | Where-Object { $_.CommandLine -like "*app-window*" }
            if ($title -eq "GH Quant" -and $wv) { break }
          }
          Start-Sleep -Seconds 12
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("preview-windows.png")
          $browsers = Get-Process msedge, chrome -ErrorAction SilentlyContinue
          Write-Host "window title: '$title' · webview2 processes: $(@($wv).Count) · browser processes: $(@($browsers).Count)"
          Get-Content (Join-Path $d.FullName "state/GHQuant.log") -ErrorAction SilentlyContinue | Select-Object -Last 30
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Remove-Item -Recurse -Force (Join-Path $d.FullName "state") -ErrorAction SilentlyContinue
          if ($title -ne "GH Quant" -or -not $wv) { throw "PC app window did not open" }

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = Get-ChildItem dist -Directory -Filter "GHQuant-*" | Select-Object -First 1
          Compress-Archive -Path $d.FullName -DestinationPath "$($d.Name).zip"

      - name: Zip (macOS, keeps executable bit)
        if: runner.os == 'macOS'
        run: |
          d=$(ls -d dist/GHQuant-*/ | head -1)
          ditto -c -k --keepParent "$d" "$(basename "$d").zip"

      - uses: actions/upload-artifact@v4
        with:
          name: GHQuant-${{ runner.os }}
          path: |
            GHQuant-*.zip
            preview-*.png

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish 'desktop-latest' release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TITLE="GH Quant - 최신 빌드"
          NOTES="파이썬 설치 없이 실행하는 버전입니다.
          - Windows: GHQuant-windows-x64.zip 압축 해제 → GHQuant.exe 더블클릭
          - Mac (Apple Silicon): GHQuant-macos-arm64.zip 압축 해제 → GHQuant 앱 우클릭 → 열기
          자세한 내용은 zip 안의 HOW-TO-RUN.txt 참고. 빌드 커밋: ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          # 태그를 지웠다 다시 만들면 GitHub 가 릴리스를 '초안'으로 남기는 경우가 있어서,
          # 태그는 새 커밋으로 옮기고 릴리스 파일만 교체한다.
          if gh api "repos/$GH_REPO/git/refs/tags/desktop-latest" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/desktop-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/desktop-latest -f sha="$GITHUB_SHA" >/dev/null
          fi
          # 예전 경쟁 상태로 남은 초안 정리
          gh api "repos/$GH_REPO/releases?per_page=50" --jq ".[] | select(.draft and .name == \"$TITLE\") | .id" \
            | xargs -r -I{} gh api -X DELETE "repos/$GH_REPO/releases/{}"
          if gh release view desktop-latest >/dev/null 2>&1; then
            # 이번 빌드에 없는 예전 파일(이름이 바뀐 이전 버전 등)은 지운다
            for a in $(gh release view desktop-latest --json assets --jq '.assets[].name'); do
              [ -f "out/$a" ] || gh release delete-asset desktop-latest "$a" -y
            done
            gh release upload desktop-latest out/*.zip out/*.png --clobber
            gh release edit desktop-latest --prerelease --draft=false --title "$TITLE" --notes "$NOTES"
          else
            gh release create desktop-latest out/*.zip out/*.png --verify-tag --prerelease --title "$TITLE" --notes "$NOTES"
          fi
          gh release view desktop-latest --json isDraft,assets --jq '"draft=\(.isDraft) assets=\(.assets | length)"'
